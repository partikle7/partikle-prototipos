<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo interactivo de Levexa: plataforma de exámenes adaptativos de clasificación de inglés con niveles MCER, licencias, certificados y verificación pública.">
<title>Levexa · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: sistema "Spark" (violeta, lima y destello de cuatro puntas) ===== */
:root{
  --bg:#f5eefb; --surface:#ffffff; --surface-2:#f1e8f7; --raise:#faf6fe; --border:#e4d6f2; --border-strong:#cdb6e6;
  --text:#1d1030; --muted:#6b5f82;
  --primary:#9b0feb; --primary-strong:#6a0da8; --primary-soft:#f1e8f7; --on-primary:#ffffff;
  --deep:#311b4c; --lilac:#be6ffb; --lime:#c5fc0b; --lime-strong:#8fc400; --pink:#ea0fcc; --mint:#0fccea;
  --green:#5eea0f; --green-strong:#3f9f00; --ok:#2f7a00; --ok-soft:#eeffb8;
  --warn:#8a5a00; --warn-soft:#fff2c7; --bad:#d10a5c; --bad-soft:#ffe0ec;
  --info:#0a7f95; --info-soft:#daf7fc; --violet:#9b0feb; --violet-soft:#f1e8f7; --yellow:#ffc000;
  --grad:linear-gradient(135deg,#be6ffb 0%,#9b0feb 100%);
  --radius:24px;
  --shadow:0 14px 34px -22px rgba(49,27,76,.6),0 1px 2px rgba(49,27,76,.08);
  --f-display:'Montserrat','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);font:500 15px/1.55 var(--f-body);min-height:100vh;position:relative;}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none;}
body::before{width:460px;height:460px;background:rgba(190,111,251,.35);top:-160px;right:-120px;}
body::after{width:380px;height:380px;background:rgba(197,252,11,.22);bottom:-140px;left:-110px;}
h1,h2,h3,.brand span{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;text-wrap:balance;}
h1{font-size:1.9rem;margin:0 0 4px;line-height:1.12;}
h2{font-size:1.2rem;margin:0 0 12px;}
h3{font-size:1.02rem;margin:0 0 8px;}
p{margin:0 0 10px;}
b,strong{font-weight:700;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.84em;font-weight:500;}
.muted{color:var(--muted);}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:12px;}
.skip{position:absolute;left:-999px;top:0;background:var(--deep);color:#fff;padding:8px 12px;z-index:100;}
.skip:focus{left:8px;top:8px;}
/* Destello de cuatro puntas: marca propia de Levexa */
.spark{display:inline-block;width:12px;height:12px;background:var(--c,var(--primary));clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}

/* ===== Estructura ===== */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 22px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;font-size:1.35rem;}
.brand span{color:var(--deep);}
.brand .logo-l{width:34px;height:34px;border-radius:12px;background:var(--lime);display:grid;place-items:center;color:var(--deep);font:800 1.1rem var(--f-display);transform:rotate(-8deg);box-shadow:0 3px 0 var(--lime-strong);flex:none;}
.brand small{font:800 .64rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--deep);background:var(--lime);padding:3px 10px;border-radius:99px;}
.top-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.inline{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:0;}
.inline select{max-width:250px;font-weight:600;text-transform:none;letter-spacing:0;}
.top .menu-btn{display:none;}
.layout{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 62px);}
#side{padding:18px 14px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow-y:auto;}
#side .role-tag{display:flex;align-items:center;gap:8px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:2px 12px 12px;}
#side .role-tag::before{content:"";width:11px;height:11px;flex:none;background:var(--primary);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
#side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:10px 14px;margin-bottom:4px;border-radius:16px;color:var(--muted);font:700 .92rem var(--f-body);cursor:pointer;transition:background .15s,color .15s,transform .15s;}
#side button svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#side button:hover{background:var(--surface);color:var(--text);transform:translateX(3px);}
#side button[aria-current="page"]{background:var(--deep);color:#fff;box-shadow:0 8px 18px -10px rgba(49,27,76,.9);}
#side button[aria-current="page"] svg{stroke:var(--lime);}
main{padding:26px 30px 70px;min-width:0;max-width:1300px;width:100%;}
main:focus{outline:none;}
.page-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px;}
.page-head p{color:var(--muted);margin:0;max-width:70ch;font-weight:500;}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  #side{position:static;height:auto;display:none;padding:12px 14px 4px;}
  #side.open{display:block;}
  .top .menu-btn{display:inline-flex;}
  main{padding:18px 16px 60px;}
  .top{padding:8px 16px;}
  .top-ctrl{margin-left:0;width:100%;}
  .inline select{max-width:165px;}
  h1{font-size:1.6rem;}
}

/* ===== Componentes ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media (min-width:761px) and (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;right:16px;top:16px;width:16px;height:16px;background:var(--c,var(--primary));clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--primary));opacity:.08;}
.kpi:nth-child(4n+1){--c:#9b0feb;} .kpi:nth-child(4n+2){--c:#5eea0f;} .kpi:nth-child(4n+3){--c:#ea0fcc;} .kpi:nth-child(4n+4){--c:#0fccea;}
.kpi b{display:block;font:800 2.1rem/1.1 var(--f-display);letter-spacing:-.04em;color:var(--text);}
.kpi span{color:var(--muted);font-size:.85rem;font-weight:600;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--deep);padding:8px 18px;border-radius:16px;font:700 .88rem var(--f-body);cursor:pointer;min-height:42px;box-shadow:0 3px 0 var(--border-strong);transition:transform .12s,box-shadow .12s,background .15s;}
.btn:hover:not(:disabled){background:var(--raise);transform:translateY(-1px);box-shadow:0 4px 0 var(--border-strong);}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--border-strong);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 3px 0 var(--primary-strong);}
.btn-primary:hover:not(:disabled){background:var(--grad);filter:brightness(1.06);box-shadow:0 4px 0 var(--primary-strong);}
.btn-primary:active:not(:disabled){box-shadow:0 0 0 var(--primary-strong);}
.btn-lime{background:var(--lime);border-color:transparent;color:var(--deep);box-shadow:0 3px 0 var(--lime-strong);}
.btn-lime:hover:not(:disabled){background:var(--lime);filter:brightness(1.04);box-shadow:0 4px 0 var(--lime-strong);}
.btn-danger{background:#ea0f6b;border-color:transparent;color:#fff;box-shadow:0 3px 0 #a8084a;}
.btn-danger:hover:not(:disabled){background:#f2347f;box-shadow:0 4px 0 #a8084a;}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);}
.btn-ghost:hover:not(:disabled){background:var(--surface);color:var(--text);box-shadow:none;transform:none;}
.btn-sm{padding:3px 13px;font-size:.78rem;min-height:32px;border-radius:12px;box-shadow:0 2px 0 var(--border-strong);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.toolbar .grow{flex:1;min-width:190px;}
.spacer{flex:1;}
label{font-size:.74rem;font-weight:700;display:block;margin-bottom:5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
input,select,textarea{width:100%;font:600 .93rem var(--f-body);color:var(--text);background:var(--raise);border:1px solid var(--border-strong);border-radius:16px;padding:9px 14px;min-height:44px;transition:border-color .15s,box-shadow .15s,background .15s;}
input:hover,select:hover,textarea:hover{border-color:var(--lilac);}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(190,111,251,.28);}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--primary);flex:none;}
input[type=file]{padding:7px 10px;}
.field{margin-bottom:14px;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);background:#fff5f9;}
.err{display:block;color:var(--bad);font-size:.82rem;font-weight:700;margin-top:4px;}
.err:empty{display:none;}
.hint{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;font-weight:500;}
.req{color:var(--bad);}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;}
@media (max-width:640px){.fgrid{grid-template-columns:1fr;}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);}
table{border-collapse:collapse;width:100%;font-size:.89rem;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--surface-2);vertical-align:middle;}
th{background:var(--raise);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);}
tbody tr:hover td{background:var(--raise);}
tr:last-child td{border-bottom:0;}
td.act{white-space:nowrap;}
td.mono,td .mono{white-space:nowrap;}
td .row{flex-wrap:nowrap;}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.68rem;font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;}
.b-gray{background:var(--surface-2);color:var(--muted);}
.b-ok{background:var(--ok-soft);color:var(--ok);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-bad{background:var(--bad-soft);color:var(--bad);}
.b-info{background:var(--info-soft);color:var(--info);}
.lvl{display:inline-block;font:800 .8rem var(--f-display);background:var(--lime);color:var(--deep);padding:2px 10px;border-radius:10px;letter-spacing:-.02em;}
.empty{text-align:center;padding:42px 16px;color:var(--muted);}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:1.05rem;}
.tabs{display:flex;flex-wrap:wrap;width:fit-content;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:4px;margin-bottom:18px;max-width:100%;}
.tabs button{background:none;border:0;border-radius:14px;padding:8px 18px;font:700 .88rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s,background .15s;}
.tabs button:hover{color:var(--text);background:var(--raise);}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 3px 0 var(--primary-strong);}
.notice{border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:.9rem;font-weight:600;border:1px solid transparent;}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:#ffe08a;}
.notice.bad{background:var(--bad-soft);color:var(--bad);border-color:#ffb3d1;}
.notice.ok{background:var(--ok-soft);color:var(--ok);border-color:#d4f06a;}
.notice.info{background:var(--info-soft);color:var(--info);border-color:#a9e6f1;}
.dl{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;margin:0;}
.dl dt{color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-top:2px;}
.dl dd{margin:0;}
@media (max-width:560px){.dl{grid-template-columns:1fr;}.dl dt{margin-top:6px;}}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;padding:5px 15px;font:700 .8rem var(--f-body);cursor:pointer;color:var(--deep);box-shadow:0 2px 0 var(--border-strong);transition:transform .12s,background .15s;}
.chip:hover{background:var(--lime);border-color:transparent;box-shadow:0 2px 0 var(--lime-strong);}
.chip:active{transform:translateY(2px);box-shadow:none;}

/* Barra de progreso segmentada de lotes */
.seg{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2);}
.seg i{display:block;height:100%;}
.seg i+i{border-left:2px solid #fff;}
.s-consumida{background:#5eea0f;} .s-asignada{background:#9b0feb;} .s-disponible{background:#dcc4f5;}
.s-revocada{background:#ffc000;} .s-vencida{background:#ea0f6b;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px;font-weight:600;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px;}
.bars .bar{display:grid;grid-template-columns:34px 1fr 34px;gap:10px;align-items:center;font-size:.85rem;margin-bottom:9px;font-weight:700;}
.bars .bar div{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.bars .bar div i{display:block;height:100%;background:linear-gradient(90deg,#be6ffb,#9b0feb);border-radius:99px;min-width:0;}

/* ===== Bienvenida (inicio de candidatos y resumen de administradores) ===== */
.welcome{position:relative;overflow:hidden;background:var(--deep);color:#fff;border-radius:28px;padding:28px 32px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:24px;box-shadow:0 26px 50px -28px rgba(49,27,76,.9);}
.welcome>*{position:relative;z-index:1;}
.welcome::before{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(190,111,251,.6),transparent 68%);z-index:0;}
.welcome::after{content:"";position:absolute;inset:0;z-index:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(115deg,transparent 40%,#000);mask-image:linear-gradient(115deg,transparent 40%,#000);}
.welcome .wdate{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:8px;}
.welcome .wdate::before{content:"";width:11px;height:11px;background:var(--lime);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
.welcome h1{color:#fff;font-size:clamp(1.6rem,3.6vw,2.4rem);margin:0 0 8px;}
.welcome h1 span{color:var(--lime);}
.welcome p{color:rgba(255,255,255,.8);margin:0 0 16px;max-width:58ch;font-weight:500;}
.wchips{display:flex;flex-wrap:wrap;gap:8px;}
.wchips span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 14px;font-size:.82rem;font-weight:600;}
.wchips b{color:var(--lime);font-family:var(--f-display);font-weight:800;}
.wmark{position:relative;width:120px;height:120px;flex:none;}
.wmark i{position:absolute;display:block;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
.wmark i:nth-child(1){inset:0;background:var(--lime);animation:twirl 9s ease-in-out infinite;}
.wmark i:nth-child(2){width:44px;height:44px;right:-14px;top:-6px;background:var(--lilac);animation:twirl 7s ease-in-out infinite reverse;}
.wmark i:nth-child(3){width:26px;height:26px;left:-6px;bottom:-4px;background:#ea0fcc;animation:twirl 6s ease-in-out infinite;}
@keyframes twirl{50%{transform:rotate(25deg) scale(1.06);}}
@media (max-width:700px){.wmark{display:none;}.welcome{padding:22px 20px;}}

/* ===== Modal y avisos ===== */
.modal-bg{position:fixed;inset:0;background:rgba(25,10,45,.62);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;z-index:60;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:30px;width:100%;max-width:580px;box-shadow:0 40px 90px -24px rgba(30,10,60,.65);animation:rise .22s ease-out;}
.modal.wide{max-width:920px;}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 24px;border-bottom:1px solid var(--surface-2);}
.modal header h2{margin:0;}
.modal .mbody{padding:20px 24px;}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--surface-2);flex-wrap:wrap;}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:90;max-width:min(400px,calc(100vw - 36px));}
.toast{display:flex;align-items:center;gap:10px;background:var(--deep);color:#fff;border:1px solid rgba(255,255,255,.14);padding:12px 18px;border-radius:18px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);font-size:.9rem;font-weight:700;animation:rise .25s ease-out;}
.toast::before{content:"";width:12px;height:12px;flex:none;background:var(--lime);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
.toast.bad::before{background:#ff4f92;} .toast.warn::before{background:var(--yellow);}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}

/* ===== Examen ===== */
.exam{max-width:780px;margin:0 auto;}
.tbar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--primary));border-radius:99px;transition:width .2s linear;}
.tbar.low i{background:linear-gradient(90deg,#ff8a8a,#ea0f6b);}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--border-strong);border-radius:18px;padding:13px 18px;margin-bottom:10px;cursor:pointer;background:var(--surface);font-weight:600;font-size:1rem;color:var(--text);text-transform:none;letter-spacing:0;box-shadow:0 3px 0 var(--border-strong);transition:transform .12s,border-color .15s,background .15s;}
.opt:hover{border-color:var(--primary);transform:translateX(3px);}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--deep);box-shadow:0 3px 0 var(--lilac);}
.opt:has(input:focus-visible){outline:3px solid var(--lilac);outline-offset:2px;}
.resource{background:#fff8dc;border:1px solid #ffe08a;padding:14px 18px;border-radius:20px;margin-bottom:16px;font-size:.98rem;font-weight:500;}
.resource small{display:block;color:var(--warn);font-weight:800;margin-bottom:5px;text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;}
.bignum{display:inline-grid;place-items:center;width:132px;height:132px;border-radius:50%;background:var(--grad);color:#fff;font:800 3.2rem/1 var(--f-display);letter-spacing:-.05em;box-shadow:0 8px 0 var(--primary-strong),0 0 0 8px rgba(197,252,11,.5);margin:6px 0 14px;animation:pop .55s ease-out;}
.chart svg{width:100%;height:auto;display:block;}

.cs-list{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;width:max-content;max-width:min(440px,86vw);max-height:280px;overflow-y:auto;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 44px -18px rgba(49,27,76,.55);z-index:80;animation:rise .12s ease-out;}

.cs-list li[aria-selected="true"]::after{content:"✓";font-weight:900;}

body.auth .layout{grid-template-columns:1fr;}

function vResumen() {
  const oid = scopeOrg();
  const bs = S.batch_licenses.filter(b => !oid || b.organization_id === oid);
  const ls = S.licenses.filter(l => !oid || licOrgId(l) === oid);

  const pend = (S.skill_results || []).filter(r => r.status === 'pending' && erOk.has(r.exam_result_id)).length;
  return welcome('Hola,', oid ? `Así va la actividad de ${esc(orgName(oid))} hoy.` : 'Así va la actividad de la plataforma hoy.', [[cnt.available, 'licencias disponibles'], [at.length, 'exámenes realizados'], [vig, 'certificados vigentes'], ...(pend ? [[pend, 'Writing por calificar']] : [])]) +

    `<div class="grid g4" style="margin-bottom:16px">
      ${oid ? k(bs.length, 'Lotes') : k(S.organizations.length, 'Organizaciones')}
      ${k(ls.length, 'Licencias en total')}${k(cnt.available, 'Disponibles')}${k(cnt.assigned, 'Asignadas')}
      ${k(cnt.consumed, 'Consumidas')}${k(cnt.revoked, 'Revocadas')}${k(at.length, 'Exámenes finalizados')}${k(vig, 'Certificados vigentes')}
    </div>
    <div class="grid g2">
      <section class="panel"><h2>Distribución de niveles obtenidos</h2><div class="bars">${LEVELS.map((l, i) => `<div class="bar"><span>${l}</span><div><i style="width:${dist[i] / mx * 100}%"></i></div><b>${dist[i]}</b></div>`).join('')}</div></section>
      <section class="panel"><h2>Estado de las licencias</h2>${segBar(cnt, ls.length)}
        ${!oid ? `<p class="muted" style="margin-top:14px">Banco: ${S.questions.filter(q => q.status === 'active').length} preguntas activas de ${S.questions.length}. Candidatos independientes: ${candidates().filter(c => !c.orgId).length}.</p>` : `<p class="muted" style="margin-top:14px">Candidatos registrados: ${candidates().filter(c => c.orgId === oid).length}.</p>`}</section>
    </div>`;
}
function segBar(c, total) {
  const order = ['consumed', 'assigned', 'available', 'revoked', 'expired'];
  return `<div class="seg" role="img" aria-label="${order.map(k => c[k] + ' ' + LIC_LABEL[k].toLowerCase() + 's').join(', ')}">${order.map(k => c[k] ? `<i class="s-${LIC_CLS[k]}" style="width:${c[k] / Math.max(1, total) * 100}%"></i>` : '').join('')}</div>
  <div class="legend">${order.map(k => `<span><i class="s-${LIC_CLS[k]}"></i>${LIC_LABEL[k]}s: ${c[k]}</span>`).join('')}</div>`;
}

function lotDetail(b, oid) {

  const ls = S.licenses.filter(l => l.batch_id === b.id).filter(l => {
    if (st && licState(l) !== st) return false;
    return !q || (l.code + ' ' + (licInfo(l).cand?.name || '')).toLowerCase().includes(q);
  });
  const rows = ls.map(l => {
    const s = licState(l), inf = licInfo(l), cd = inf.cand, op = canOperate(l), acts = [];
    if (op && s === 'available') acts.push(['licAssign', 'Asignar']);
    if (op && s === 'assigned') acts.push(['licReassign', 'Reasignar'], ['licRelease', 'Liberar'], ['licRevoke', 'Revocar']);
    if (op && s === 'revoked') acts.push(['licReactivate', 'Reactivar']);
    return `<tr><td class="mono"><b>${l.code}</b></td><td>${badge(LIC_LABEL[s], STATUS_LIC[s])}</td>
      <td>${cd ? esc(cd.name) : '—'}</td><td>${fmtD(inf.assignedAt)}</td><td>${l.consumed_at ? fmtD(l.consumed_at) : '—'}</td>
      <td class="act"><div class="row">${acts.map(([a, t]) => `<button class="btn btn-sm" data-act="${a}" data-code="${l.code}">${t}</button>`).join('')}<button class="btn btn-sm btn-ghost" data-act="licHist" data-code="${l.code}">Historial</button></div></td></tr>`;

    ${ts(b.expires_at) < Date.now() ? '<div class="notice bad" style="margin-top:12px">Este lote está vencido: ninguna licencia no consumida admite acciones.</div>' : ''}
    ${b.status === 'inactive' ? '<div class="notice warn" style="margin-top:12px">Este lote está inactivo: sus licencias no admiten acciones hasta que se active.</div>' : ''}
    ${can('manage_batches') ? `<div class="row" style="margin-top:12px"><button class="btn btn-sm" data-act="lotToggle" data-id="${b.id}">${b.status === 'active' ? 'Desactivar lote' : 'Activar lote'}</button></div>` : ''}</section>
    <div class="toolbar">${bindIn('licQ', 'Buscar', 'Código o candidato')}${bindSel('licSt', 'Estado', [['', 'Todos'], ...Object.entries(LIC_LABEL)])}

    tbl(['Código', 'Estado', 'Candidato', 'Asignada', 'Consumida', 'Acciones'], rows, 'Ninguna licencia coincide con los filtros.');
}
function candOptions(oid) { return candidates().filter(c => c.orgId === oid && c.active).map(c => [c.id, `${c.name} — ${c.docType} ${c.docNum}`]); }
function openAssign(code, mode) {
  const l = licOf(code), b = batchOf(l), inf = licInfo(l), opts = candOptions(b.organization_id).filter(([id]) => id !== inf.userId);
  if (!opts.length) { toast('No hay candidatos activos disponibles en esta organización.', 'warn'); return; }
  openModal({
    title: (mode === 'reassign' ? 'Reasignar' : 'Asignar') + ' licencia ' + code, submit: mode === 'reassign' ? 'Reasignar' : 'Asignar',
    body: `${mode === 'reassign' && inf.userId ? `<div class="notice warn">La asignación actual de <b>${esc(inf.cand.name)}</b> se cerrará.</div>` : ''}${fld('Candidato', 'cand', opts[0][0], { req: 1, type: 'select', opts: [['', 'Selecciona un candidato…'], ...opts] })}
      <p class="muted">La licencia vence el <b>${fmtD(l.expires_at)}</b>.</p>`,
    onSubmit(v) {
      if (!v.cand) return { cand: 'Selecciona un candidato.' };
      const err = mode === 'reassign' ? doReassign(l, v.cand) : doAssign(l, v.cand);
      if (err) return { form: err };
      commit(); toast('Licencia asignada a ' + candOf(v.cand).name + '.');
    }
  });
}
function openBulk(bid) {
  const b = byId(S.batch_licenses, bid), free = S.licenses.filter(l => l.batch_id === bid && licState(l) === 'available').length;
  const taken = new Set(S.licenses.filter(l => l.batch_id === bid && ['assigned', 'consumed'].includes(l.status)).map(l => licInfo(l).userId));
  const cs = candidates().filter(c => c.orgId === b.organization_id && c.active && !taken.has(c.id));
  openModal({
    title: 'Asignación masiva', submit: 'Asignar seleccionados',
    body: `<p>Licencias disponibles en el lote: <b>${free}</b>. Se asignan en orden a los candidatos marcados (los que ya tienen licencia en este lote no aparecen).</p>
      ${cs.length ? `<div style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px 12px">${cs.map((c, i) => `<label style="font-weight:400;display:flex;gap:8px;padding:3px 0"><input type="checkbox" name="c_${c.id}" value="1"${i < Math.min(free, 3) ? ' checked' : ''}> ${esc(c.name)} <span class="muted">· ${esc(c.docType)} ${esc(c.docNum)}</span></label>`).join('')}</div>` : '<div class="notice info">No hay candidatos activos sin licencia en este lote.</div>'}<small class="err" id="e-sel" role="alert"></small>`,
    onSubmit(v) {
      const ids = Object.keys(v).filter(k => k.startsWith('c_')).map(k => k.slice(2));
      if (!ids.length) return { form: 'Marca al menos un candidato.' };
      if (ids.length > free) return { form: `Seleccionaste ${ids.length} candidatos pero solo hay ${free} licencias disponibles.` };
      const pool = S.licenses.filter(l => l.batch_id === bid && licState(l) === 'available');
      ids.forEach((id, i) => doAssign(pool[i], id));
      commit(); toast(`${ids.length} licencias asignadas.`);
    }

}

async function licAction(kind, code) {
  const l = licOf(code), who = esc(licInfo(l).cand?.name || '—');
  if (kind === 'revoke') {
    if (await confirmDlg({ title: 'Revocar licencia', msg: `La licencia <b class="mono">${code}</b> quedará bloqueada y se cerrará la asignación a <b>${who}</b>.`, ok: 'Revocar', danger: true })) { doRevoke(l); commit(); toast('Licencia revocada.', 'warn'); }
  } else if (kind === 'release') {
    if (await confirmDlg({ title: 'Liberar licencia', msg: `¿Liberar <b class="mono">${code}</b>? Se cierra la asignación a <b>${who}</b> y la licencia vuelve a estar disponible.`, ok: 'Liberar' })) { doRelease(l); commit(); toast('Licencia liberada y disponible.'); }
  } else if (kind === 'reactivate') {
    if (await confirmDlg({ title: 'Reactivar licencia', msg: `¿Reactivar <b class="mono">${code}</b>? Volverá al inventario como disponible.`, ok: 'Reactivar' })) { l.status = 'available'; commit(); toast('Licencia reactivada y disponible.'); }
  }
}
function openBatch() {
  const exs = S.exams.filter(e => e.status === 'published').map(e => [e.id, e.title]);
  const orgs = S.organizations.filter(o => o.status === 'active');
  const exp = new Date(Date.now() + 365 * DAY).toISOString().slice(0, 10);
  openModal({
    title: 'Nuevo lote de licencias',
    body: `<div class="fgrid">${fld('Organización', 'org', orgs[0]?.id || '', { req: 1, type: 'select', opts: [['', 'Selecciona…'], ...orgs.map(o => [o.id, o.name])] })}${fld('Examen', 'exam', 'x1', { type: 'select', opts: exs })}
      ${fld('Cantidad de licencias', 'qty', 20, { req: 1, type: 'number', attrs: 'min="1" max="500"' })}${fld('Precio unitario', 'price', 60000, { req: 1, type: 'number', attrs: 'min="0"' })}
      ${fld('Moneda', 'cur', 'COP', { type: 'select', opts: [['COP', 'COP'], ['USD', 'USD']] })}${fld('Fecha de vencimiento', 'expiry', exp, { req: 1, type: 'date', hint: 'Después de esta fecha la organización no puede usar ni reasignar.' })}</div>`,
    onSubmit(v) {
      const e = {}, n = +v.qty;
      if (!v.org) e.org = 'Selecciona la organización.';
      if (!Number.isInteger(n) || n < 1 || n > 500) e.qty = 'Ingresa un entero entre 1 y 500.';
      if (v.price === '' || +v.price < 0) e.price = 'Ingresa un precio válido (0 o más).';
      if (!v.expiry || ts(v.expiry + 'T23:59:59') <= Date.now()) e.expiry = 'La fecha de vencimiento debe ser futura.';

function payErrors(p) {

    if (!/^\d{13,19}$/.test(n) || !luhn(n)) e.push('El número de tarjeta no es válido.');
    if (!c.name.trim()) e.push('Ingresa el nombre del titular.');
    if (!m || +m[1] < 1 || +m[1] > 12 || new Date(2000 + +m[2], +m[1], 0, 23, 59) < new Date()) e.push('La fecha de vencimiento no es válida o ya pasó (formato MM/AA).');
    if (!/^\d{3,4}$/.test(c.cvc)) e.push('El CVC debe tener 3 o 4 dígitos.');
  } else if (p.method === 'pse') { if (!p.pse.doc.trim()) e.push('Ingresa el documento o NIT del titular.'); }

function finishPay() {

  if (p.method === 'wallet' && p.wallet.phone === '3000000001') { ok = false; reason = 'La billetera no tiene saldo suficiente.'; }
  const tx = { id: 'TX-' + Math.random().toString(36).slice(2, 8).toUpperCase(), method: p.method, last4: p.method === 'card' ? p.card.number.replace(/\s/g, '').slice(-4) : '', at: new Date().toISOString() };

// Gráfica SVG de la evolución de θ (con su banda de ±SE) en una habilidad CAT
function thetaChart(trace, k, prior) {

  const grid = LEVELS.map((l, i) => `<line x1="${L}" x2="${W - Rr}" y1="${y(-3 + i)}" y2="${y(-3 + i)}" stroke="var(--border)"/><text x="${L - 5}" y="${y(-2.5 + i) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${l}</text>`).join('') + `<line x1="${L}" x2="${W - Rr}" y1="${y(3)}" y2="${y(3)}" stroke="var(--border)"/>`;
  const band = `<polygon fill="var(--primary)" opacity=".13" points="${vals.map((v, i) => x(i) + ',' + y(v.t + v.se)).join(' ')} ${vals.map((v, i) => [x(i), y(v.t - v.se)]).reverse().map(p => p.join(',')).join(' ')}"/>`;
  const line = `<polyline fill="none" stroke="var(--primary)" stroke-width="2" points="${vals.map((v, i) => x(i) + ',' + y(v.t)).join(' ')}"/>`;

  return `<figure style="margin:0"><figcaption style="font-weight:800;margin-bottom:4px">${esc(SKILLS[k])}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de θ en ${esc(SKILLS[k])} a lo largo de ${n} ítems">${grid}${band}${line}${dots}</svg></figure>`;
}

  xlsTemplate() { downloadTemplate(); },
  csvSample(d, t) { const ta = $('[name=csv]', t.closest('.modal-bg')); ta.value = CSV_HEAD + '\nCC,1099000111,E2026001,Rafael,Montoya Díaz,rafael.montoya@ejemplo.edu.co\nCC,1099000112,E2026002,Elena,Cortés Mora,elena.cortes@ejemplo.edu.co\nXX,1,E0,Fila,con tipo inválido,x@ejemplo.edu.co'; ta.focus(); },
  attOpen(d) { openAttempt(d.id); }, csv() { exportCSV(); }, print() { window.print(); },
  certView(d) { openCert(d.id); },
  async certRevoke(d) {
    const c = byId(S.certificates, d.id);
    if (await confirmDlg({ title: 'Revocar certificado ' + c.number, msg: 'Un certificado revocado deja de ser válido en el verificador público.', ok: 'Revocar', danger: true })) {
      c.status = 'revoked'; save(); render(); closeTop(); openAttempt(d.att); toast('Certificado revocado.', 'warn');
    }
  },
  async certIssue(d) {
    const a = attemptViewById(d.att);
    if (await confirmDlg({ title: 'Emitir certificado', msg: 'Se emitirá el certificado de este resultado (uno por resultado) con número y código propios.', ok: 'Emitir' })) {
      const cfg = activeCfg(a.examId), n = issueCert(S, byId(S.exam_results, a.resultId), cfg);
      n.issued_on = new Date().toISOString().slice(0, 10); n.valid_until = addDays(n.issued_on, cfg.certificate_valid_days).slice(0, 10);
      save(); render(); closeTop(); openAttempt(d.att); toast('Certificado ' + n.number + ' emitido.');
    }
  },
  async certRenew(d) {
    const c = byId(S.certificates, d.id);
    if (await confirmDlg({ title: 'Renovar vigencia', msg: 'El certificado vuelve a estar vigente con una nueva fecha de vencimiento. Conserva su número y código.', ok: 'Renovar' })) {
      c.valid_until = addDays(new Date().toISOString(), activeCfg().certificate_valid_days).slice(0, 10); c.status = 'valid';
      save(); render(); closeTop(); openAttempt(d.att); toast('Vigencia renovada.');
    }
  },
  fill(d) { U.entry = { code: d.code, doc: d.doc }; render(); },
  exCancel() { U.ex = { stage: 'entry' }; render(); },
  exOmit() { answer(null); }, exNext() { beginSkill(U.ex.nextK); }, wrGrade(d) { openWritingGrade(d.att); }, exDone() { U.ex = { stage: 'entry' }; U.entry = { code: '', doc: '' }; render(); },
  buyExam() { const c = candOf(S.auth.userId); U.entry = { code: U.lastPurchase.codes[0], doc: c ? c.docNum : '' }; U.lastPurchase = null; S.ui.view = 'examen'; U.ex = { stage: 'entry' }; commit(); },
  buyAgain() { U.lastPurchase = null; render(); },
  fillVer(d) { U.ver = d.code; U.verRes = null; render(); },
  logout() { if (guardExam()) return; logout(); },
  authTab(d) { U.authTab = d.tab; render(); }, regType(d) { U.regType = d.t; render(); },
  fillLogin(d) { U.login = { email: d.email, pass: DEMO_PASS }; render(); },
  forgot() { toast('Te enviaríamos un enlace para restablecer la contraseña (simulado).'); },
  guestExam() { login({ role: 'cand', name: 'Estudiante', guest: true }); },
  guestVerify() { login({ role: 'pub', name: 'Visitante', guest: true }); },
  payMethod(d) { U.pay.method = d.m; render(); }, payFill(d) { U.pay.card.number = d.n; render(); },
  payRetry() { U.pay.stage = 'form'; U.pay.result = null; render(); }, payCancel() { U.pay = null; render(); },
  payDoneIndep() { U.pay = null; S.ui.view = 'comprar'; render(); },
  payDoneLote() { const id = S.batch_licenses.find(b => b.purchase_id === U.pay.result.purchase.id)?.id; U.pay = null; U.lotSel = id; S.ui.view = 'lotes'; commit(); }
};
// Un solo escuchador de clics para todas las acciones
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A') e.preventDefault();
  fn(t.dataset, t);
});
// Filtros y campos enlazados a U (data-bind="ruta.a.valor")
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  const path = t.dataset.bind.split('.'); let o = U; path.slice(0, -1).forEach(k => o = o[k]);
  o[path.at(-1)] = t.type === 'checkbox' ? t.checked : t.value; render();
});
// Formularios de página
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const kind = f.dataset.form;
  if (kind === 'cfg') saveCfg(f);
  else if (kind === 'entry') submitEntry(f);
  else if (kind === 'buy') submitBuy(f);
  else if (kind === 'lbuy') submitLote(f);
  else if (kind === 'pay') submitPay(f);
  else if (kind === 'login') submitLogin(f);
  else if (kind === 'reg') submitReg(f);
  else if (kind === 'writing') submitWriting();
  else if (kind === 'start') { if (!f.ok.checked) { $('#e-ok').textContent = 'Debes confirmar para iniciar.'; f.ok.focus(); } else startExam(); }
  else if (kind === 'answer') { const r = f.querySelector('[name=ans]:checked'); if (!r) { toast('Selecciona una opción antes de responder.', 'warn'); return; } answer(r.value); }
  else if (kind === 'verify') { const code = new FormData(f).get('code').trim().toUpperCase(); U.ver = code; if (!code) { $('#e-code').textContent = 'Ingresa el código.'; return; } U.verRes = { c: S.certificates.find(c => c.verification_code === code) }; render(); }
});

// Etiqueta cada celda con el encabezado de su columna (para mostrar las filas como tarjetas en pantallas angostas)
function labelTables() {
  document.querySelectorAll('table').forEach(t => {
    const hs = [...t.querySelectorAll('thead th')].map(h => h.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { if (td.tagName === 'TD' && !td.dataset.label && hs[i]) td.dataset.label = hs[i]; }));
  });
}
new MutationObserver(labelTables).observe(document.body, { childList: true, subtree: true });
(function boot() {

  load();
  render();
})();
</script>
