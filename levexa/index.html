<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo interactivo de Levexa: plataforma de exámenes adaptativos de clasificación de inglés con niveles MCER, licencias, certificados y verificación pública.">
<title>Levexa · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens de diseño: claro por defecto, oscuro por preferencia del sistema o por selector ===== */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9; --border:#dbe2ee;
  --text:#1d2433; --muted:#5a6578;
  --primary:#2f5fd0; --primary-strong:#2449a8; --primary-soft:#e6edfc; --on-primary:#ffffff;
  --ok:#1b7f55; --ok-soft:#e1f4ea; --warn:#8f5a00; --warn-soft:#fdf0d5;
  --bad:#b83232; --bad-soft:#fbe5e5; --info:#2f5fd0; --info-soft:#e6edfc;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px -14px rgba(20,30,60,.2);
  color-scheme:light;
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);font:15px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;}
h1,h2,h3,.brand span{font-family:'Outfit',system-ui,sans-serif;text-wrap:balance;}
h1{font-size:1.55rem;margin:0 0 4px;font-weight:600;}
h2{font-size:1.15rem;margin:0 0 10px;font-weight:600;}
h3{font-size:1rem;margin:0 0 8px;font-weight:600;}
p{margin:0 0 10px;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.86em;}
.muted{color:var(--muted);}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px;}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--on-primary);padding:8px 12px;z-index:100;}
.skip:focus{left:8px;top:8px;}

/* ===== Estructura ===== */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem;}
.brand small{font:500 .7rem 'Inter';color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:99px;}
.top-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.inline{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);}
.inline select{max-width:230px;}
.top .menu-btn{display:none;}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 58px);}
#side{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow-y:auto;}
#side .role-tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 10px 8px;}
#side button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 12px;border-radius:0 8px 8px 0;color:var(--text);font:500 .92rem 'Inter';cursor:pointer;}
#side button:hover{background:var(--surface-2);}
#side button[aria-current="page"]{background:var(--primary-soft);border-left-color:var(--primary);color:var(--primary-strong);font-weight:600;}
main{padding:22px 26px 60px;min-width:0;max-width:1280px;width:100%;}
main:focus{outline:none;}
.page-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;}
.page-head p{color:var(--muted);margin:0;max-width:70ch;}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  #side{position:static;height:auto;display:none;border-right:0;border-bottom:1px solid var(--border);}
  #side.open{display:block;}
  .top .menu-btn{display:inline-flex;}
  main{padding:16px 16px 50px;}
  .top{padding:8px 16px;}
  .top-ctrl{margin-left:0;width:100%;}
  .inline select{max-width:160px;}
}

/* ===== Componentes ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media (min-width:761px) and (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.kpi b{display:block;font:600 1.7rem 'Outfit';}
.kpi span{color:var(--muted);font-size:.85rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:9px;font:500 .9rem 'Inter';cursor:pointer;min-height:38px;}
.btn:hover:not(:disabled){background:var(--surface-2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
.btn-primary:hover:not(:disabled){background:var(--primary-strong);border-color:var(--primary-strong);}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff;}
.btn-danger:hover:not(:disabled){filter:brightness(1.08);background:var(--bad);}
.btn-ghost{background:transparent;}
.btn-sm{padding:4px 10px;font-size:.8rem;min-height:30px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
.toolbar .grow{flex:1;min-width:180px;}
.spacer{flex:1;}
label{font-size:.82rem;font-weight:600;display:block;margin-bottom:3px;}
input,select,textarea{width:100%;font:400 .92rem 'Inter';color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:38px;}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--primary);}
.field{margin-bottom:12px;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);}
.err{display:block;color:var(--bad);font-size:.8rem;min-height:0;}
.err:empty{display:none;}
.hint{display:block;color:var(--muted);font-size:.78rem;margin-top:2px;}
.req{color:var(--bad);}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;}
@media (max-width:640px){.fgrid{grid-template-columns:1fr;}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
table{border-collapse:collapse;width:100%;font-size:.88rem;}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;}
th{background:var(--surface-2);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;}
tr:last-child td{border-bottom:0;}
td.act{white-space:nowrap;}
td.mono,td .mono{white-space:nowrap;}
td .row{flex-wrap:nowrap;}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap;}
.b-gray{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}
.b-ok{background:var(--ok-soft);color:var(--ok);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-bad{background:var(--bad-soft);color:var(--bad);}
.b-info{background:var(--info-soft);color:var(--info);}
.lvl{font:600 .8rem 'Outfit';background:var(--primary-soft);color:var(--primary-strong);padding:2px 9px;border-radius:6px;}
.empty{text-align:center;padding:34px 16px;color:var(--muted);}
.empty b{display:block;color:var(--text);margin-bottom:4px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font:500 .9rem 'Inter';color:var(--muted);cursor:pointer;white-space:nowrap;}
.tabs button[aria-selected="true"]{color:var(--primary-strong);border-bottom-color:var(--primary);font-weight:600;}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.88rem;}
.notice.warn{background:var(--warn-soft);color:var(--warn);}
.notice.bad{background:var(--bad-soft);color:var(--bad);}
.notice.ok{background:var(--ok-soft);color:var(--ok);}
.notice.info{background:var(--info-soft);color:var(--info);}
.dl{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;margin:0;}
.dl dt{color:var(--muted);font-size:.85rem;}
.dl dd{margin:0;}
@media (max-width:560px){.dl{grid-template-columns:1fr;}.dl dt{margin-top:6px;}}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:4px 12px;font:500 .78rem 'Inter';cursor:pointer;color:var(--text);}
.chip:hover{border-color:var(--primary);}

/* Barra de progreso segmentada de lotes */
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);}
.seg i{display:block;height:100%;}
.s-consumida{background:#1b9a64;} .s-asignada{background:#3d6fe0;} .s-disponible{background:#9fb4d8;}
.s-revocada{background:#d9a21b;} .s-vencida{background:#c94b4b;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
.batch-card{display:block;}
.bars .bar{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font-size:.82rem;margin-bottom:6px;}
.bars .bar div{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.bars .bar div i{display:block;height:100%;background:var(--primary);}

/* ===== Modal y avisos ===== */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;z-index:60;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);}
.modal.wide{max-width:900px;}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);}
.modal header h2{margin:0;}
.modal .mbody{padding:18px;}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap;}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(380px,calc(100vw - 32px));}
.toast{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--ok);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:.88rem;}
.toast.bad{border-left-color:var(--bad);} .toast.warn{border-left-color:var(--warn);}

/* ===== Examen ===== */
.exam{max-width:760px;margin:0 auto;}
.tbar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border);}
.tbar i{display:block;height:100%;background:var(--primary);transition:width .2s linear;}
.tbar.low i{background:var(--bad);}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;background:var(--surface);font-weight:400;font-size:.95rem;}
.opt:hover{border-color:var(--primary);}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);}
.opt:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:2px;}
.resource{background:var(--surface-2);border-left:4px solid var(--primary);padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:.95rem;}
.resource small{display:block;color:var(--muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-size:.7rem;}
.bignum{font:700 3.4rem/1 'Outfit';color:var(--primary-strong);}
.chart svg{width:100%;height:auto;display:block;}

/* ===== Certificado (siempre como hoja clara) ===== */
.cert{background:#fffdf7;color:#1d2433;border:3px double #b99346;padding:34px 30px;text-align:center;border-radius:6px;font-family:'Outfit',sans-serif;}
.cert h2{font-size:1.5rem;letter-spacing:.04em;color:#7a5a16;margin:0 0 4px;}
.cert .nm{font-size:1.9rem;font-weight:600;margin:14px 0 4px;}
.cert .lv{font-size:3.4rem;font-weight:700;color:#2449a8;line-height:1.1;}
.cert p{font-family:'Inter',sans-serif;color:#3a4256;margin:4px 0;font-size:.92rem;}
.cert .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;text-align:left;margin-top:18px;font-family:'Inter',sans-serif;font-size:.84rem;color:#3a4256;}
.cert .meta b{display:block;color:#7a5a16;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;}
.cert .stamp{display:inline-block;margin-top:10px;border:2px solid #b83232;color:#b83232;padding:3px 14px;font-weight:700;letter-spacing:.1em;transform:rotate(-4deg);}
@media print{
  body>*:not(#modal-root){display:none !important;}
  .modal-bg{position:static;background:none;padding:0;display:block;}
  .modal{box-shadow:none;border:0;max-width:none;}
  .modal header,.modal footer,.no-print{display:none !important;}
  .modal .mbody{padding:0;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   1. UTILIDADES Y CONSTANTES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 864e5;
const iso = ms => new Date(ms).toISOString();
const ts = s => new Date(s).getTime();
const addDays = (s, n) => iso(ts(s) + n * DAY);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtD = s => s ? new Date(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtDT = s => s ? new Date(s).toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtMoney = (n, cur) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: cur || 'COP', maximumFractionDigits: 0 }).format(n);
const fmtSec = s => { s = Math.round(s); return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; };
const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const SKILLS = { grammar: 'Gramática', vocabulary: 'Vocabulario', reading: 'Lectura', listening: 'Comprensión auditiva' };
const TF = ['Verdadero', 'Falso'];
const DOC_TYPES = ['CC', 'TI', 'CE', 'PAS'];
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

// Generador pseudoaleatorio con semilla (datos de ejemplo reproducibles)
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// Código de licencia o verificación sin caracteres ambiguos
function genCode(prefix, used, R = Math.random) {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const part = () => Array.from({ length: 4 }, () => A[Math.floor(R() * A.length)]).join('');
  let c; do { c = `${prefix}-${part()}-${part()}`; } while (used.has(c));
  used.add(c); return c;
}

/* =====================================================================
   2. DATOS MOCK (semilla)
   ===================================================================== */
// Banco de preguntas: [habilidad, nivel, enunciado, opciones, índice correcto, recurso]
const P = {
  a1: 'Tom is ten. He has a dog called Max. Max is brown and likes to play in the park.',
  a2: 'Last weekend Laura visited her grandparents. They live in a small village near the mountains. They had lunch together and walked by the river in the afternoon.',
  b1: 'Remote work has changed how many companies operate. Employees save commuting time and often report a better balance between work and personal life. However, some managers worry that teams communicate less and that new staff feel isolated.',
  b2: 'Urban gardens are spreading across large cities. Beyond providing fresh vegetables, they strengthen community ties and reduce local temperatures. Critics, however, argue that the land would be better used for affordable housing, a claim supporters consider a false dilemma.',
  c1: 'The notion that technological progress inevitably yields social benefit has been increasingly contested. While automation boosts productivity, its gains tend to accrue disproportionately to capital owners, prompting scholars to call for redistributive mechanisms that temper emerging inequalities.',
  c2: 'Notwithstanding the exhaustive empirical scrutiny it has undergone, the hypothesis remains, in the strictest sense, unfalsifiable; its proponents, ever resourceful, reinterpret each anomaly as corroboration, thereby insulating the theory from refutation.'
};
const QBANK = [
  // A1
  ['g', 0, 'She ___ a student.', ['am', 'is', 'are', 'be'], 1],
  ['g', 0, 'They ___ from Colombia.', ['is', 'am', 'are', 'be'], 2],
  ['v', 0, 'Which word is a fruit?', ['table', 'apple', 'window', 'chair'], 1],
  ['v', 0, 'What day comes after Tuesday?', ['Wednesday', 'Friday', 'Sunday', 'Thursday'], 0],
  ['r', 0, 'What colour is Max?', ['Black', 'Brown', 'White', 'Yellow'], 1, P.a1],
  ['r', 0, 'Tom has a cat.', TF, 1, P.a1],
  ['l', 0, 'Where does Ana live?', ['Bogotá', 'Cali', 'Lima', 'Quito'], 1, 'Hello, my name is Ana. I live in Cali.'],
  ['l', 0, 'What time does the shop open?', ['At eight', 'At nine', 'At ten', 'At seven'], 1, 'The shop opens at nine.'],
  // A2
  ['g', 1, 'Yesterday I ___ to the cinema.', ['go', 'went', 'gone', 'going'], 1],
  ['g', 1, "There isn't ___ milk in the fridge.", ['some', 'any', 'a', 'many'], 1],
  ['v', 1, 'A person who cooks in a restaurant is a ___.', ['driver', 'chef', 'nurse', 'pilot'], 1],
  ['v', 1, "The opposite of 'cheap' is ___.", ['expensive', 'small', 'slow', 'early'], 0],
  ['r', 1, "Where do Laura's grandparents live?", ['In a big city', 'In a village', 'By the sea', 'In another country'], 1, P.a2],
  ['r', 1, 'Laura walked by the river in the morning.', TF, 1, P.a2],
  ['l', 1, 'Which platform does the train leave from?', ['Platform two', 'Platform three', 'Platform four', 'Platform six'], 2, 'Excuse me, the train to Medellín leaves from platform four at ten past six.'],
  ['l', 1, 'What does the speaker NOT want?', ['Milk', 'Coffee', 'Sugar', 'Water'], 2, "I'd like a coffee with milk, but no sugar, please."],
  // B1
  ['g', 2, 'If it rains tomorrow, we ___ at home.', ['stay', 'will stay', 'stayed', 'would stay'], 1],
  ['g', 2, 'She has lived here ___ 2015.', ['for', 'since', 'from', 'during'], 1],
  ['v', 2, 'I need to ___ a decision before Friday.', ['do', 'make', 'have', 'get'], 1],
  ['v', 2, 'The meeting was ___ because the manager was ill.', ['called off', 'called up', 'called in', 'called for'], 0],
  ['r', 2, 'What concern do some managers have?', ['Salaries are too high', 'Teams may communicate less', 'Offices are too expensive', 'Employees work too many hours'], 1, P.b1],
  ['r', 2, 'Employees usually lose time commuting when working remotely.', TF, 1, P.b1],
  ['l', 2, 'Why is the flight delayed?', ['A strike', 'Fog', 'A technical problem', 'A late crew'], 1, 'The flight has been delayed by two hours because of fog, so passengers should wait in the departure lounge.'],
  ['l', 2, "Why didn't the speaker call?", ['No time', 'The phone battery died', 'Forgot the number', 'Was sleeping'], 1, 'I was going to call you, but my phone battery died.'],
  // B2
  ['g', 3, 'I wish I ___ more time to travel.', ['have', 'had', 'would have', 'having'], 1],
  ['g', 3, 'By next year, she ___ her degree.', ['will finish', 'will have finished', 'finishes', 'is finishing'], 1],

/* =====================================================================
   4. LÓGICA: motor de examen adaptativo
   ===================================================================== */
// Tiempo límite de una pregunta: propio > tabla habilidad×nivel > por defecto
function timeFor(q, cfg) { return q.timeLimit || cfg.timeTable?.[q.skill]?.[LEVELS[q.level]] || cfg.defaultTime; }

function newEngine(cfg, bank, rand) {
  return { cfg, rand, theta: LEVELS.indexOf(cfg.startLevel) + 0.5, used: new Set(), trace: [], pool: bank.filter(q => q.status === 'activa') };
}
// Siguiente pregunta no usada con dificultad más cercana al nivel estimado
function nextQuestion(E) {
  let best = null, bd = 1e9;
  for (const q of E.pool) {
    if (E.used.has(q.id)) continue;
    const d = Math.abs(q.difficulty - E.theta) + E.rand() * 0.001;
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}
// Ajusta theta: acierto sube y error baja; la rapidez amplifica o atenúa el cambio
function applyAnswer(E, q, opt, usedSec, limit) {
  const c = E.cfg, expired = opt === null, correct = !expired && opt === q.correct;
  const r = expired ? 1 : usedSec / limit, w = c.timeWeight;
  let delta, f = 1;
  if (correct) { delta = c.stepUp; f = r <= c.fastPct / 100 ? 1 + w : r >= c.slowPct / 100 ? 1 - w : 1; }
  else { delta = -c.stepDown; f = (expired || r >= c.slowPct / 100) ? 1 + w : 1; }
  E.theta = clamp(E.theta + delta * f, 0, 6);
  E.used.add(q.id);
  E.trace.push({ qId: q.id, stem: q.stem.slice(0, 80), skill: q.skill, level: q.level, correct, expired, used: +usedSec.toFixed(1), limit, theta: +E.theta.toFixed(2), opt });
  return correct;
}
// Termina al llegar al máximo, sin preguntas, o al mínimo si la estimación se estabiliza
function isDone(E) {
  const n = E.trace.length, c = E.cfg;
  if (n >= c.maxQ || !nextQuestion(E)) return true;
  if (n >= c.minQ && n >= c.stopWindow) {
    const w = E.trace.slice(-c.stopWindow).map(t => t.theta);
    if (Math.max(...w) - Math.min(...w) <= c.stopDelta) return true;
  }
  return false;
}
function summarize(E) {
  const bySkill = {}; let totalTime = 0;
  Object.keys(SKILLS).forEach(k => bySkill[k] = { ok: 0, n: 0 });
  E.trace.forEach(t => { bySkill[t.skill].n++; if (t.correct) bySkill[t.skill].ok++; totalTime += t.used; });
  const theta = +E.theta.toFixed(2);
  return { theta, level: LEVELS[Math.min(5, Math.floor(theta))], score: Math.round(theta / 6 * 100), bySkill, totalTime: Math.round(totalTime) };
}
// Simula un examen completo con una habilidad real conocida (datos históricos)
function simulate(cfg, bank, ability, R) {
  const E = newEngine(cfg, bank, R);
  while (!isDone(E)) {
    const q = nextQuestion(E), lim = timeFor(q, cfg);
    const guess = q.opts.length === 2 ? 0.5 : 0.25;
    const p = guess + (1 - guess) / (1 + Math.exp(-(ability - q.difficulty) * 1.6));
    if (R() < 0.05) { applyAnswer(E, q, null, lim, lim); continue; }
    const ok = R() < p;
    applyAnswer(E, q, ok ? q.correct : (q.correct + 1) % q.opts.length, lim * (0.15 + R() * 0.75), lim);
  }
  return E;
}

   ===================================================================== */
// Estado efectivo: "vencida" se deriva de la fecha de vencimiento del lote
function licState(l) { return l.status !== 'consumida' && ts(batchOf(l).expiry) < Date.now() ? 'vencida' : l.status; }
function daysSince(s) { return (Date.now() - ts(s)) / DAY; }
function isRecoverable(l) {
  const b = batchOf(l);
  if (!b.orgId || !b.inactivityDays || licState(l) === 'vencida') return false;
  return l.status === 'asignada' && daysSince(l.assignedAt) > b.inactivityDays;
}
function planDeadline(b, from) { return iso(Math.min(ts(from) + b.studentDays * DAY, ts(b.expiry))); }
const canOperate = l => !!batchOf(l).orgId && !['vencida', 'consumida'].includes(licState(l));
function closeActive(l, reason, state = 'cerrada') {
  const h = l.history.find(x => x.state === 'activa');
  if (h) { h.state = state; h.closedAt = new Date().toISOString(); h.reason = reason; }
}
function doAssign(l, candId) {
  const b = batchOf(l), c = candOf(candId);
  if (!canOperate(l)) return 'La licencia no admite acciones (vencida, consumida o de compra individual).';
  if (!c || c.status !== 'activo' || c.orgId !== b.orgId) return 'El candidato no es válido para esta organización.';
  const nowS = new Date().toISOString();
  l.status = 'asignada'; l.candId = candId; l.assignedAt = nowS; l.deadline = planDeadline(b, nowS);
  l.history.push({ candId, at: nowS, state: 'activa', closedAt: null, reason: '' });
  return null;
}
function doRevoke(l, reason) { closeActive(l, 'Revocada: ' + (reason || 'sin motivo indicado')); l.status = 'revocada'; l.candId = null; l.assignedAt = null; l.deadline = null; }
function doRecover(l) {
  closeActive(l, l.status === 'revocada' ? 'Devuelta al inventario' : 'Recuperada por inactividad');
  l.status = 'disponible'; l.candId = null; l.assignedAt = null; l.deadline = null;
}
function doReassign(l, candId) {
  if (l.status === 'asignada') closeActive(l, 'Reasignada a otro candidato');
  l.status = 'disponible';
  return doAssign(l, candId);
}
function batchCounts(b) {
  const c = { disponible: 0, asignada: 0, consumida: 0, revocada: 0, vencida: 0 };
  S.licenses.filter(l => l.batchId === b.id).forEach(l => c[licState(l)]++);
  return c;
}
// Validación del código en el ingreso del candidato
function validateEntry(code, doc) {
  code = code.trim().toUpperCase(); doc = doc.trim();
  const l = licOf(code);
  if (!l) return { msg: 'El código no existe. Revisa que esté escrito como ENG-XXXX-XXXX.' };
  if (l.status === 'consumida') return { msg: 'Esta licencia ya fue consumida: solo permite un examen.' };
  if (l.status === 'revocada') return { msg: 'Esta licencia fue revocada por tu organización. Comunícate con ella.' };
  const b = batchOf(l);
  if (licState(l) === 'vencida') return { msg: `Esta licencia venció el ${fmtD(b.expiry)}. Ya no puede usarse.` };
  if (l.status === 'disponible') return { msg: 'Esta licencia aún no ha sido asignada a un estudiante. Pide a tu organización que te la asigne.' };
  const c = candOf(l.candId);
  if (!doc) return { msg: 'Ingresa tu número de documento para confirmar que la licencia es tuya.' };

  const h = { el: bg, opener: document.activeElement, o, closed: false };

// Lee y valida el formulario del editor de preguntas
function readQuestion(form, base, validate) {
  const g = n => (form.querySelector(`[name="${n}"]`) || {}).value || '', e = {};
  const type = g('type'), stem = g('stem').trim(), d = parseFloat(g('difficulty'));
  let opts, correct;
  if (type === 'tf') { opts = [...TF]; correct = +(form.querySelector('[name=correctTf]:checked')?.value ?? 0); }
  else {
    const sel = form.querySelector('[name=correct]:checked'), pick = sel ? +sel.value : -1;
    opts = []; correct = -1;
    [0, 1, 2, 3].forEach(i => { const t = g('opt' + i).trim(); if (t) { if (i === pick) correct = opts.length; opts.push(t); } });
    if (opts.length < 2) e.opts = 'Ingresa al menos 2 opciones.'; else if (correct < 0) e.opts = 'Marca cuál opción es la correcta (y que no esté vacía).';
  }
  if (!stem) e.stem = 'El enunciado es obligatorio.';
  if (isNaN(d) || d < 0 || d > 6) e.difficulty = 'Ingresa un número entre 0 y 6.';
  const tl = g('timeLimit'); if (tl && +tl < 5) e.timeLimit = 'Mínimo 5 segundos.';
  const q = { ...base, stem, skill: g('skill'), level: +g('level'), type, status: g('status'), difficulty: d, timeLimit: tl ? +tl : null, resource: g('resource').trim(), opts, correct };
  return Object.keys(e).length && validate ? { errs: e } : { q };
}

function saveCfg(form) {
  const v = Object.fromEntries(new FormData(form)), e = [], c = {};
  ['minQ', 'maxQ', 'defaultTime', 'stepUp', 'stepDown', 'fastPct', 'slowPct', 'timeWeight', 'stopDelta', 'stopWindow', 'certDays'].forEach(k => c[k] = parseFloat(v[k]));
  if ([...Object.values(c)].some(isNaN)) e.push('Completa todos los campos numéricos.');
  if (c.minQ < 3 || c.maxQ < c.minQ) e.push('El máximo de preguntas debe ser mayor o igual al mínimo (mínimo 3).');
  if (c.maxQ > S.questions.filter(q => q.status === 'activa').length) e.push('El máximo supera las preguntas activas del banco.');
  if (c.stepUp <= 0 || c.stepDown <= 0 || c.stepUp > 2 || c.stepDown > 2) e.push('Los ajustes por acierto y error deben estar entre 0 y 2.');
  if (!(c.fastPct >= 1 && c.slowPct <= 100 && c.fastPct < c.slowPct)) e.push('El umbral rápido debe ser menor que el lento, entre 1 y 100.');
  if (c.timeWeight < 0 || c.timeWeight > 1) e.push('El peso del tiempo debe estar entre 0 y 1.');
  if (c.stopWindow < 2 || c.stopWindow > c.minQ) e.push('Las respuestas a comparar deben estar entre 2 y el mínimo de preguntas.');
  const tt = {};
  Object.keys(SKILLS).forEach(k => { tt[k] = {}; LEVELS.forEach(l => { const x = v[`t_${k}_${l}`]; if (x !== '' && x != null) { if (+x < 5) e.push(`Tiempo inválido en ${SKILLS[k]} ${l} (mínimo 5 s).`); else tt[k][l] = +x; } }); });
  const g = $('#e-form', form);
  if (e.length) { g.innerHTML = e.map(esc).join('<br>'); g.hidden = false; g.scrollIntoView({ block: 'center' }); return; }
  S.cfg = { ...S.cfg, ...c, startLevel: v.startLevel, timeTable: tt };
  commit(); toast('Configuración guardada. Se aplicará al siguiente examen.');
}

// Gráfica SVG de la evolución del nivel estimado (theta) pregunta a pregunta
function thetaChart(trace, start) {
  const W = 640, H = 250, L = 38, Rr = 12, T = 12, Bm = 28, n = trace.length;
  const x = i => L + (W - L - Rr) * i / Math.max(1, n), y = v => T + (H - T - Bm) * (1 - v / 6);
  const pts = [start, ...trace.map(t => t.theta)];
  const grid = LEVELS.map((l, i) => `<line x1="${L}" x2="${W - Rr}" y1="${y(i)}" y2="${y(i)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(i + 0.5) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${l}</text>`).join('') + `<line x1="${L}" x2="${W - Rr}" y1="${y(6)}" y2="${y(6)}" stroke="var(--border)"/>`;
  const xl = pts.map((_, i) => (n < 16 || i % 2 === 0) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${i === 0 ? 'Ini' : i}</text>` : '').join('');
  const dots = pts.map((v, i) => { const t = trace[i - 1], col = i === 0 ? 'var(--muted)' : t.correct ? 'var(--ok)' : 'var(--bad)'; return `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${col}"><title>${i === 0 ? 'Nivel inicial' : 'Pregunta ' + i + (t.expired ? ' (expirada)' : t.correct ? ' (correcta)' : ' (incorrecta)')}: ${v}</title></circle>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del nivel estimado a lo largo de ${n} preguntas">${grid}<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${pts.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>${dots}${xl}</svg>
  <div class="legend"><span><i style="background:var(--ok)"></i>Correcta</span><span><i style="background:var(--bad)"></i>Incorrecta o expirada</span><span>Eje vertical: nivel estimado (0 = A1, 6 = C2)</span></div>`;
}

function sampleCodes() {
  const L = S.licenses, out = [];
  const pick = (f) => L.find(l => f(l));
  const ok = pick(l => l.status === 'asignada' && licState(l) === 'asignada' && ts(l.deadline) > Date.now() && batchOf(l).orgId && !isRecoverable(l)) || pick(l => l.status === 'asignada' && licState(l) === 'asignada' && ts(l.deadline) > Date.now());
  const doc = l => candOf(l.candId)?.docNum || '';
  if (ok) { out.push(['Válido', ok.code, doc(ok)]); const other = S.candidates.find(c => c.id !== ok.candId && c.orgId === batchOf(ok).orgId); if (other) out.push(['Asignada a otra persona', ok.code, other.docNum]); }
  const v = pick(l => licState(l) === 'vencida'); if (v) out.push(['Vencido', v.code, doc(v)]);
  const r = pick(l => l.status === 'revocada'); if (r) out.push(['Revocado', r.code, '']);
  const c = pick(l => l.status === 'consumida'); if (c) out.push(['Consumido', c.code, doc(c)]);
  const late = pick(l => l.status === 'asignada' && licState(l) === 'asignada' && ts(l.deadline) < Date.now()); if (late) out.push(['Fuera de plazo', late.code, doc(late)]);
  const d = pick(l => l.status === 'disponible' && licState(l) === 'disponible'); if (d) out.push(['Sin asignar', d.code, '']);
  out.push(['No existe', 'ENG-ZZZZ-0000', '']);
  return out;
}

// Flujo del examen: validar código, iniciar, responder, finalizar
function submitEntry(form) {
  const v = Object.fromEntries(new FormData(form)); U.entry = { code: v.code, doc: v.doc };
  const r = validateEntry(v.code, v.doc), g = $('#e-form', form);
  if (!r.ok) { g.textContent = r.msg; g.hidden = false; g.focus?.(); return; }
  U.ex = { stage: 'instr', lic: r.lic, cand: r.cand }; render();
}
function startExam() {
  const ex = U.ex, l = ex.lic, b = batchOf(l), nowS = new Date().toISOString();
  l.status = 'consumida'; l.consumedAt = nowS; closeActive(l, 'Examen realizado', 'consumida');
  const cfg = JSON.parse(JSON.stringify(S.cfg));
  ex.E = newEngine(cfg, S.questions, Math.random);
  ex.att = { id: uid('t'), licCode: l.code, candId: ex.cand.id, orgId: b.orgId, examId: b.examId, status: 'en_curso', startedAt: nowS };
  S.attempts.push(ex.att); save();
  ex.stage = 'run'; nextStep();
}
function nextStep() {
  const ex = U.ex;
  if (isDone(ex.E)) return finishExam();
  ex.q = nextQuestion(ex.E); ex.limit = timeFor(ex.q, ex.E.cfg); ex.t0 = Date.now(); render();
  clearInterval(ex.tm); ex.tm = setInterval(tick, 150);
}
function tick() {
  const ex = U.ex; if (ex.stage !== 'run') return clearInterval(ex.tm);
  const el = (Date.now() - ex.t0) / 1000, left = Math.max(0, ex.limit - el), bar = $('#tbar');
  if (bar) { bar.firstElementChild.style.width = (left / ex.limit * 100) + '%'; bar.classList.toggle('low', left / ex.limit < 0.2); $('#tsec').textContent = Math.ceil(left) + ' s'; }
  if (left <= 0) answer(null);
}
function answer(opt) {
  const ex = U.ex; clearInterval(ex.tm);
  const used = Math.min(ex.limit, (Date.now() - ex.t0) / 1000);
  applyAnswer(ex.E, ex.q, opt, used, ex.limit); nextStep();
}
function finishExam() {
  const ex = U.ex, sum = summarize(ex.E), a = ex.att;
  Object.assign(a, { status: 'finalizado', finishedAt: new Date().toISOString(), theta: sum.theta, level: sum.level, score: sum.score, bySkill: sum.bySkill, totalTime: sum.totalTime, trace: ex.E.trace });
  ex.cert = issueCert(S, a, S.cfg); ex.sum = sum; ex.stage = 'final'; commit();
}

// Un solo escuchador de clics para todas las acciones
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A') e.preventDefault();

  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  const path = t.dataset.bind.split('.'); let o = U; path.slice(0, -1).forEach(k => o = o[k]);
  o[path.at(-1)] = t.type === 'checkbox' ? t.checked : t.value; render();

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const kind = f.dataset.form;
  if (kind === 'cfg') saveCfg(f);
  else if (kind === 'entry') submitEntry(f);
  else if (kind === 'buy') submitBuy(f);
  else if (kind === 'start') { if (!f.ok.checked) { $('#e-ok').textContent = 'Debes confirmar para iniciar.'; f.ok.focus(); } else startExam(); }
  else if (kind === 'answer') { const r = f.querySelector('[name=ans]:checked'); if (!r) { toast('Selecciona una opción antes de responder.', 'warn'); return; } answer(+r.value); }
  else if (kind === 'verify') { const code = new FormData(f).get('code').trim().toUpperCase(); U.ver = code; if (!code) { $('#e-code').textContent = 'Ingresa el código.'; return; } U.verRes = { c: S.certs.find(c => c.code === code) }; render(); }
