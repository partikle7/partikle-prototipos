<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo interactivo de Levexa: plataforma de exámenes adaptativos de clasificación de inglés con niveles MCER, licencias, certificados y verificación pública.">
<title>Levexa · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: estilo juvenil (botones con relieve, bordes gruesos, color vivo) en tema claro ===== */
:root{
  --bg:#f3f7fd; --surface:#ffffff; --surface-2:#eef3fb; --border:#dde5f1; --border-strong:#c7d3e6;
  --text:#1f2a44; --muted:#5d6b86;
  --primary:#1f6feb; --primary-strong:#1556c0; --primary-soft:#e3eeff; --on-primary:#ffffff;
  --green:#4cb800; --green-strong:#3a9100; --ok:#2f8a00; --ok-soft:#e3f6cd;
  --warn:#a85d00; --warn-soft:#fff0c9; --bad:#d13434; --bad-soft:#ffe2e2;
  --info:#1569c7; --info-soft:#ddeefd; --violet:#7c5cfc; --violet-soft:#ece8ff; --yellow:#ffc800;
  --radius:18px;
  --shadow:0 2px 0 var(--border),0 14px 30px -20px rgba(31,42,68,.35);
  color-scheme:light;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);font:600 15px/1.55 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;position:relative;}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;}
body::before{width:420px;height:420px;background:#d6e6ff;top:-140px;right:-120px;}
body::after{width:360px;height:360px;background:#e6defe;bottom:-120px;left:-100px;}
h1,h2,h3,.brand span{font-family:'Nunito',system-ui,sans-serif;font-weight:900;letter-spacing:-.01em;text-wrap:balance;}
h1{font-size:1.9rem;margin:0 0 4px;line-height:1.15;}
h2{font-size:1.2rem;margin:0 0 12px;}
h3{font-size:1.02rem;margin:0 0 8px;}
p{margin:0 0 10px;}
b,strong{font-weight:800;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.84em;font-weight:500;}
.muted{color:var(--muted);}
:focus-visible{outline:3px solid #8db8ff;outline-offset:2px;border-radius:10px;}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:#fff;padding:8px 12px;z-index:100;}
.skip:focus{left:8px;top:8px;}

/* ===== Estructura ===== */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--border);}
.brand{display:flex;align-items:center;gap:9px;font-size:1.35rem;}
.brand span{color:var(--primary-strong);}
.brand small{font:800 .66rem 'Nunito';letter-spacing:.08em;text-transform:uppercase;color:var(--violet);background:var(--violet-soft);padding:3px 10px;border-radius:99px;}
.top-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.inline{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:0;}
.inline select{max-width:250px;font-weight:700;text-transform:none;letter-spacing:0;}
.top .menu-btn{display:none;}
.layout{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 62px);}
#side{padding:18px 14px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow-y:auto;}
#side .role-tag{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:2px 12px 12px;}
#side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:2px solid transparent;padding:10px 14px;margin-bottom:4px;border-radius:14px;color:var(--muted);font:800 .93rem 'Nunito';cursor:pointer;}
#side button svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#side button:hover{background:var(--surface);color:var(--text);}
#side button[aria-current="page"]{background:var(--primary-soft);border-color:#9cc3ff;color:var(--primary-strong);}
main{padding:26px 30px 70px;min-width:0;max-width:1300px;width:100%;}
main:focus{outline:none;}
.page-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px;}
.page-head p{color:var(--muted);margin:0;max-width:70ch;font-weight:600;}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  #side{position:static;height:auto;display:none;padding:12px 14px 4px;}
  #side.open{display:block;}
  .top .menu-btn{display:inline-flex;}
  main{padding:18px 16px 60px;}
  .top{padding:8px 16px;}
  .top-ctrl{margin-left:0;width:100%;}
  .inline select{max-width:165px;}
  h1{font-size:1.6rem;}
}

/* ===== Componentes ===== */
.panel{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px;}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media (min-width:761px) and (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c,var(--primary));}
.kpi:nth-child(4n+1){--c:#1f6feb;} .kpi:nth-child(4n+2){--c:#4cb800;} .kpi:nth-child(4n+3){--c:#ff9600;} .kpi:nth-child(4n+4){--c:#7c5cfc;}
.kpi b{display:block;font:900 2.1rem/1.1 'Nunito';color:var(--c,var(--text));}
.kpi span{color:var(--muted);font-size:.85rem;font-weight:700;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--border);border-bottom-width:4px;background:var(--surface);color:var(--primary-strong);padding:7px 16px 5px;border-radius:14px;font:800 .88rem 'Nunito';cursor:pointer;min-height:42px;transition:transform .06s,filter .15s,background .15s;}
.btn:hover:not(:disabled){background:var(--primary-soft);}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;padding-bottom:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--primary);border-color:var(--primary-strong);color:#fff;text-transform:uppercase;letter-spacing:.04em;}
.btn-primary:hover:not(:disabled){background:#3b84f5;}
.btn-danger{background:var(--bad);border-color:#a32222;color:#fff;}
.btn-danger:hover:not(:disabled){background:#e04a4a;}
.btn-ghost{background:transparent;border-color:transparent;border-bottom-width:2px;color:var(--muted);}
.btn-ghost:hover:not(:disabled){background:var(--surface);color:var(--text);}
.btn-sm{padding:3px 12px 2px;font-size:.78rem;min-height:32px;border-radius:11px;border-bottom-width:3px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.toolbar .grow{flex:1;min-width:190px;}
.spacer{flex:1;}
label{font-size:.78rem;font-weight:800;display:block;margin-bottom:5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
input,select,textarea{width:100%;font:700 .93rem 'Nunito';color:var(--text);background:#f8fafd;border:2px solid var(--border);border-radius:13px;padding:9px 12px;min-height:44px;}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong);}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(31,111,235,.15);}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--primary);flex:none;}
input[type=file]{padding:7px 10px;}
.field{margin-bottom:14px;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);background:#fff7f7;}
.err{display:block;color:var(--bad);font-size:.82rem;font-weight:800;margin-top:4px;}
.err:empty{display:none;}
.hint{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;font-weight:600;}
.req{color:var(--bad);}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;}
@media (max-width:640px){.fgrid{grid-template-columns:1fr;}}
.tbl-wrap{overflow-x:auto;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);}
table{border-collapse:collapse;width:100%;font-size:.89rem;}
th,td{padding:11px 14px;text-align:left;border-bottom:2px solid var(--surface-2);vertical-align:middle;}
th{background:#f7f9fd;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;border-bottom:2px solid var(--border);}
tbody tr:hover td{background:#f9fbff;}
tr:last-child td{border-bottom:0;}
td.act{white-space:nowrap;}
td.mono,td .mono{white-space:nowrap;}
td .row{flex-wrap:nowrap;}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.7rem;font-weight:900;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;}
.b-gray{background:var(--surface-2);color:var(--muted);}
.b-ok{background:var(--ok-soft);color:var(--ok);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-bad{background:var(--bad-soft);color:var(--bad);}
.b-info{background:var(--info-soft);color:var(--info);}
.lvl{display:inline-block;font:900 .82rem 'Nunito';background:var(--violet-soft);color:var(--violet);padding:2px 10px;border-radius:9px;border-bottom:3px solid #cfc5ff;}
.empty{text-align:center;padding:42px 16px;color:var(--muted);}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:1.05rem;}
.tabs{display:flex;flex-wrap:wrap;width:fit-content;gap:4px;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:4px;margin-bottom:18px;max-width:100%;}
.tabs button{background:none;border:0;border-radius:12px;padding:8px 18px;font:800 .88rem 'Nunito';color:var(--muted);cursor:pointer;white-space:nowrap;}
.tabs button:hover{color:var(--text);}
.tabs button[aria-selected="true"]{background:var(--primary);color:#fff;box-shadow:0 3px 0 var(--primary-strong);}
.notice{border-radius:14px;padding:11px 16px;margin-bottom:14px;font-size:.9rem;font-weight:700;border:2px solid transparent;}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:#ffdf8a;}
.notice.bad{background:var(--bad-soft);color:var(--bad);border-color:#ffb9b9;}
.notice.ok{background:var(--ok-soft);color:var(--ok);border-color:#b9e48e;}
.notice.info{background:var(--info-soft);color:var(--info);border-color:#b4d8f8;}
.dl{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;margin:0;}
.dl dt{color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding-top:2px;}
.dl dd{margin:0;}
@media (max-width:560px){.dl{grid-template-columns:1fr;}.dl dt{margin-top:6px;}}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--surface);border:2px solid var(--border);border-bottom-width:4px;border-radius:99px;padding:5px 15px 3px;font:800 .8rem 'Nunito';cursor:pointer;color:var(--primary-strong);}
.chip:hover{background:var(--primary-soft);border-color:#9cc3ff;}
.chip:active{transform:translateY(2px);border-bottom-width:2px;}

/* Barra de progreso segmentada de lotes */
.seg{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2);}
.seg i{display:block;height:100%;}
.seg i+i{border-left:2px solid #fff;}
.s-consumida{background:#4cb800;} .s-asignada{background:#1f6feb;} .s-disponible{background:#a9c6f5;}
.s-revocada{background:#ffb020;} .s-vencida{background:#ee5555;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px;font-weight:700;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px;}
.bars .bar{display:grid;grid-template-columns:34px 1fr 34px;gap:10px;align-items:center;font-size:.85rem;margin-bottom:9px;font-weight:800;}
.bars .bar div{height:16px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.bars .bar div i{display:block;height:100%;background:linear-gradient(90deg,#4aa0ff,#1f6feb);border-radius:99px;min-width:0;}

/* ===== Modal y avisos ===== */
.modal-bg{position:fixed;inset:0;background:rgba(20,32,60,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;z-index:60;}
.modal{background:var(--surface);border:2px solid var(--border);border-radius:24px;width:100%;max-width:580px;box-shadow:0 6px 0 var(--border),0 40px 80px -30px rgba(20,32,60,.6);animation:rise .22s ease-out;}
.modal.wide{max-width:920px;}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 22px;border-bottom:2px solid var(--surface-2);}
.modal header h2{margin:0;}
.modal .mbody{padding:20px 22px;}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:2px solid var(--surface-2);flex-wrap:wrap;}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:90;max-width:min(400px,calc(100vw - 36px));}
.toast{background:#1f2a44;color:#fff;border-bottom:4px solid var(--green);padding:12px 18px;border-radius:16px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);font-size:.9rem;font-weight:800;animation:rise .25s ease-out;}
.toast.bad{border-bottom-color:#ff6b6b;} .toast.warn{border-bottom-color:var(--yellow);}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}

/* ===== Examen ===== */
.exam{max-width:780px;margin:0 auto;}
.tbar{height:18px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.tbar i{display:block;height:100%;background:linear-gradient(180deg,#5ab0ff,#1f6feb);border-radius:99px;transition:width .2s linear;position:relative;}
.tbar i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.4);}
.tbar.low i{background:linear-gradient(180deg,#ff8a8a,#ee5555);}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--border);border-bottom-width:5px;border-radius:16px;padding:13px 18px 11px;margin-bottom:10px;cursor:pointer;background:var(--surface);font-weight:700;font-size:1rem;color:var(--text);text-transform:none;letter-spacing:0;}
.opt:hover{background:#f6faff;border-color:#b8d3fb;}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary-strong);}
.opt:has(input:focus-visible){outline:3px solid #8db8ff;outline-offset:2px;}
.resource{background:#fff9e6;border:2px solid #ffe29a;padding:14px 16px;border-radius:16px;margin-bottom:16px;font-size:.98rem;font-weight:600;}
.resource small{display:block;color:var(--warn);font-weight:900;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;}
.bignum{display:inline-grid;place-items:center;width:132px;height:132px;border-radius:50%;background:var(--primary);color:#fff;font:900 3.2rem/1 'Nunito';box-shadow:0 8px 0 var(--primary-strong);margin:6px 0 14px;animation:pop .55s ease-out;}
.chart svg{width:100%;height:auto;display:block;}
fieldset legend{font-family:'Nunito';font-weight:900;}

/* ===== Select personalizado (reemplaza el desplegable nativo) ===== */
.cs{position:relative;width:100%;}
.cs-native{display:none !important;}
.cs-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:700 .93rem 'Nunito';color:var(--text);background:#f8fafd;border:2px solid var(--border);border-radius:13px;padding:9px 12px;min-height:44px;cursor:pointer;text-transform:none;letter-spacing:0;}
.cs-btn:hover{border-color:var(--border-strong);}
.cs-btn:focus-visible,.cs.open .cs-btn{outline:none;background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(31,111,235,.15);}
.cs-btn:disabled{opacity:.55;cursor:not-allowed;}
.cs-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cs-btn svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;}
.cs.open .cs-btn svg{transform:rotate(180deg);}
.cs-list{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;width:max-content;max-width:min(440px,86vw);max-height:280px;overflow-y:auto;margin:0;padding:6px;list-style:none;background:#fff;border:2px solid var(--border);border-radius:16px;box-shadow:0 4px 0 var(--border),0 24px 40px -18px rgba(31,42,68,.45);z-index:80;animation:rise .12s ease-out;}
.cs-list[hidden]{display:none !important;}
.cs-list li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 12px;border-radius:11px;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--text);text-transform:none;letter-spacing:0;}
.cs-list li.act{background:var(--surface-2);}
.cs-list li[aria-selected="true"]{background:var(--primary-soft);color:var(--primary-strong);font-weight:800;}
.cs-list li[aria-selected="true"]::after{content:"✓";font-weight:900;}
.field.invalid .cs-btn{border-color:var(--bad);background:#fff7f7;}
.inline .cs{min-width:210px;max-width:260px;}

/* ===== Acceso, registro y pasarela ===== */
body.auth .layout{grid-template-columns:1fr;}
body.auth #side,body.auth .top .menu-btn{display:none !important;}
.auth-wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;max-width:1080px;margin:10px auto 0;align-items:stretch;}
.hero{background:linear-gradient(155deg,#1f6feb 0%,#4f86f7 55%,#7c5cfc 100%);color:#fff;border-radius:28px;padding:38px 36px;box-shadow:0 8px 0 #1556c0;}
.hero-list{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px;font-weight:800;}
.hero-list li{display:flex;gap:10px;align-items:center;}
.hero-list li::before{content:"✓";display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);font-weight:900;flex:none;}
.auth-card{margin:0;padding:30px;}
@media (max-width:860px){.auth-wrap{grid-template-columns:1fr;}.hero{padding:26px 22px;}.hero h1{font-size:1.7rem !important;margin-top:14px !important;}}
.spinner{width:54px;height:54px;border-radius:50%;border:6px solid var(--primary-soft);border-top-color:var(--primary);margin:0 auto 18px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.user-chip{display:flex;align-items:center;gap:10px;}
.user-chip .av{width:36px;height:36px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-weight:900;border-bottom:3px solid #cfc5ff;flex:none;}
.user-chip b{display:block;line-height:1.1;font-size:.9rem;}
.user-chip small{color:var(--muted);font-weight:700;font-size:.72rem;}
@media (max-width:900px){.user-chip small{display:none;}}

/* ===== Certificado (siempre como hoja clara) ===== */
.cert{background:#fffdf7;color:#1d2433;border:3px double #b99346;padding:34px 30px;text-align:center;border-radius:10px;font-family:'Nunito',sans-serif;}
.cert h2{font-size:1.5rem;letter-spacing:.04em;color:#7a5a16;margin:0 0 4px;}
.cert .nm{font-size:1.9rem;font-weight:900;margin:14px 0 4px;}
.cert .lv{font-size:3.4rem;font-weight:900;color:#1556c0;line-height:1.1;}
.cert p{color:#3a4256;margin:4px 0;font-size:.92rem;}
.cert .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;text-align:left;margin-top:18px;font-size:.84rem;color:#3a4256;}
.cert .meta b{display:block;color:#7a5a16;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;}
.cert .stamp{display:inline-block;margin-top:10px;border:2px solid #b83232;color:#b83232;padding:3px 14px;font-weight:900;letter-spacing:.1em;transform:rotate(-4deg);}
@media print{
  body::before,body::after{display:none;}
  body>*:not(#modal-root){display:none !important;}
  .modal-bg{position:static;background:none;padding:0;display:block;backdrop-filter:none;}
  .modal{box-shadow:none;border:0;max-width:none;}
  .modal header,.modal footer,.no-print{display:none !important;}
  .modal .mbody{padding:0;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* =====================================================================
   4. LÓGICA: motor de examen adaptativo
   ===================================================================== */
// Tiempo límite de una pregunta: propio > tabla habilidad×nivel > por defecto
function timeFor(q, cfg) { return q.timeLimit || cfg.timeTable?.[q.skill]?.[LEVELS[q.level]] || cfg.defaultTime; }

function newEngine(cfg, bank, rand) {
  return { cfg, rand, theta: LEVELS.indexOf(cfg.startLevel) + 0.5, used: new Set(), trace: [], pool: bank.filter(q => q.status === 'activa') };
}
// Siguiente pregunta no usada con dificultad más cercana al nivel estimado
function nextQuestion(E) {
  let best = null, bd = 1e9;
  for (const q of E.pool) {
    if (E.used.has(q.id)) continue;
    const d = Math.abs(q.difficulty - E.theta) + E.rand() * 0.001;
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}
// Ajusta theta: acierto sube y error baja; la rapidez amplifica o atenúa el cambio
function applyAnswer(E, q, opt, usedSec, limit) {
  const c = E.cfg, expired = opt === null, correct = !expired && opt === q.correct;
  const r = expired ? 1 : usedSec / limit, w = c.timeWeight;
  let delta, f = 1;
  if (correct) { delta = c.stepUp; f = r <= c.fastPct / 100 ? 1 + w : r >= c.slowPct / 100 ? 1 - w : 1; }
  else { delta = -c.stepDown; f = (expired || r >= c.slowPct / 100) ? 1 + w : 1; }
  E.theta = clamp(E.theta + delta * f, 0, 6);
  E.used.add(q.id);
  E.trace.push({ qId: q.id, stem: q.stem.slice(0, 80), skill: q.skill, level: q.level, correct, expired, used: +usedSec.toFixed(1), limit, theta: +E.theta.toFixed(2), opt });
  return correct;
}
// Termina al llegar al máximo, sin preguntas, o al mínimo si la estimación se estabiliza
function isDone(E) {
  const n = E.trace.length, c = E.cfg;
  if (n >= c.maxQ || !nextQuestion(E)) return true;
  if (n >= c.minQ && n >= c.stopWindow) {
    const w = E.trace.slice(-c.stopWindow).map(t => t.theta);
    if (Math.max(...w) - Math.min(...w) <= c.stopDelta) return true;
  }
  return false;
}
function summarize(E) {
  const bySkill = {}; let totalTime = 0;
  Object.keys(SKILLS).forEach(k => bySkill[k] = { ok: 0, n: 0 });
  E.trace.forEach(t => { bySkill[t.skill].n++; if (t.correct) bySkill[t.skill].ok++; totalTime += t.used; });
  const theta = +E.theta.toFixed(2);
  return { theta, level: LEVELS[Math.min(5, Math.floor(theta))], score: Math.round(theta / 6 * 100), bySkill, totalTime: Math.round(totalTime) };
}
// Simula un examen completo con una habilidad real conocida (datos históricos)
function simulate(cfg, bank, ability, R) {
  const E = newEngine(cfg, bank, R);
  while (!isDone(E)) {
    const q = nextQuestion(E), lim = timeFor(q, cfg);
    const guess = q.opts.length === 2 ? 0.5 : 0.25;
    const p = guess + (1 - guess) / (1 + Math.exp(-(ability - q.difficulty) * 1.6));
    if (R() < 0.05) { applyAnswer(E, q, null, lim, lim); continue; }
    const ok = R() < p;
    applyAnswer(E, q, ok ? q.correct : (q.correct + 1) % q.opts.length, lim * (0.15 + R() * 0.75), lim);
  }
  return E;
}

function upgradeSelects(root) {

    const setAct = i => { const items = $$('li', list); items.forEach(li => li.classList.remove('act')); act = clamp(i, 0, items.length - 1); const li = items[act]; if (li) { li.classList.add('act'); li.scrollIntoView({ block: 'nearest' }); btn.setAttribute('aria-activedescendant', li.id); } };

// Crea la compra, el lote y las licencias (solo se guardan los últimos 4 dígitos de la tarjeta)
function newPurchase(ctx, tx, ok, extra) {
  const ex = examOf(ctx.exam), unit = ctx.unit || ex.price;
  return { id: uid('p'), candId: null, orgId: null, examId: ex.id, qty: ctx.qty, total: unit * ctx.qty, currency: ex.currency, status: ok ? 'pagado' : 'rechazado', date: tx.at, codes: [], batchId: null, txId: tx.id, method: tx.method, last4: tx.last4, ...extra };
}
function createIndepPurchase(ctx, tx, ok) {
  const p = newPurchase(ctx, tx, ok, { candId: ctx.candId }), c = candOf(ctx.candId), ex = examOf(ctx.exam);
  if (ok) {
    const bt = { id: uid('b'), num: 'L-' + String(S.batches.length + 1).padStart(4, '0'), orgId: null, examId: ex.id, qty: ctx.qty, price: ex.price, currency: ex.currency, expiry: addDays(tx.at, 365), studentDays: 30, inactivityDays: 0, createdAt: tx.at };
    S.batches.push(bt); const used = new Set(S.licenses.map(l => l.code));
    for (let i = 0; i < ctx.qty; i++) { const l = { code: genCode('ENG', used), batchId: bt.id, status: 'asignada', candId: c.id, assignedAt: tx.at, deadline: planDeadline(bt, tx.at), consumedAt: null, history: [{ candId: c.id, at: tx.at, state: 'activa', closedAt: null, reason: '' }] }; S.licenses.push(l); p.codes.push(l.code); }
    p.batchId = bt.id; U.lastPurchase = { codes: p.codes, total: p.total, currency: p.currency, doc: c.docNum };
  }
  S.purchases.push(p); return p;
}
function createLotPurchase(ctx, tx, ok) {
  const p = newPurchase(ctx, tx, ok, { orgId: ctx.orgId });
  if (ok) {
    const ex = examOf(ctx.exam), bt = { id: uid('b'), num: 'L-' + String(S.batches.length + 1).padStart(4, '0'), orgId: ctx.orgId, examId: ex.id, qty: ctx.qty, price: ctx.unit, currency: ex.currency, expiry: addDays(tx.at, 365), studentDays: ctx.sd, inactivityDays: ctx.inact, createdAt: tx.at };
    S.batches.push(bt); const used = new Set(S.licenses.map(l => l.code));
    for (let i = 0; i < ctx.qty; i++) { const l = { code: genCode('ENG', used), batchId: bt.id, status: 'disponible', candId: null, assignedAt: null, deadline: null, consumedAt: null, history: [] }; S.licenses.push(l); p.codes.push(l.code); }
    p.batchId = bt.id;
  }
  S.purchases.push(p); return p;
}

// Lee un Excel/CSV y lo vuelca como texto CSV en el cuadro de revisión
function readSheet(file, root) {
  if (!file) return;
  const ta = $('[name=csv]', root), put = rows => { ta.value = rows.map(r => r.map(c => String(c ?? '').replace(/,/g, ' ').trim()).join(',')).join('\n'); toast('Archivo leído: ' + (rows.length - 1) + ' filas. Revisa y pulsa Importar.'); };
  const rd = new FileReader();
  if (/\.csv$/i.test(file.name)) { rd.onload = () => { ta.value = String(rd.result).replace(/^﻿/, ''); toast('CSV leído. Revisa y pulsa Importar.'); }; rd.readAsText(file); return; }
  if (typeof XLSX === 'undefined') { toast('No se pudo cargar el lector de Excel (¿sin conexión?). Usa un archivo CSV.', 'bad'); return; }
  rd.onload = () => { try { const wb = XLSX.read(rd.result, { type: 'array' }); put(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }).filter(r => r.some(c => String(c).trim()))); } catch (e) { toast('No se pudo leer el archivo Excel.', 'bad'); } };
  rd.readAsArrayBuffer(file);
}

}

// Lee y valida el formulario del editor de preguntas
function readQuestion(form, base, validate) {
  const g = n => (form.querySelector(`[name="${n}"]`) || {}).value || '', e = {};
  const type = g('type'), stem = g('stem').trim(), d = parseFloat(g('difficulty'));
  let opts, correct;
  if (type === 'tf') { opts = [...TF]; correct = +(form.querySelector('[name=correctTf]:checked')?.value ?? 0); }
  else {
    const sel = form.querySelector('[name=correct]:checked'), pick = sel ? +sel.value : -1;
    opts = []; correct = -1;
    [0, 1, 2, 3].forEach(i => { const t = g('opt' + i).trim(); if (t) { if (i === pick) correct = opts.length; opts.push(t); } });
    if (opts.length < 2) e.opts = 'Ingresa al menos 2 opciones.'; else if (correct < 0) e.opts = 'Marca cuál opción es la correcta (y que no esté vacía).';

  const q = { ...base, stem, skill: g('skill'), level: +g('level'), type, status: g('status'), difficulty: d, timeLimit: tl ? +tl : null, resource: g('resource').trim(), opts, correct };
  return Object.keys(e).length && validate ? { errs: e } : { q };

// Gráfica SVG de la evolución del nivel estimado (theta) pregunta a pregunta
function thetaChart(trace, start) {
  const W = 640, H = 250, L = 38, Rr = 12, T = 12, Bm = 28, n = trace.length;
  const x = i => L + (W - L - Rr) * i / Math.max(1, n), y = v => T + (H - T - Bm) * (1 - v / 6);

  const grid = LEVELS.map((l, i) => `<line x1="${L}" x2="${W - Rr}" y1="${y(i)}" y2="${y(i)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(i + 0.5) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${l}</text>`).join('') + `<line x1="${L}" x2="${W - Rr}" y1="${y(6)}" y2="${y(6)}" stroke="var(--border)"/>`;
  const xl = pts.map((_, i) => (n < 16 || i % 2 === 0) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${i === 0 ? 'Ini' : i}</text>` : '').join('');
  const dots = pts.map((v, i) => { const t = trace[i - 1], col = i === 0 ? 'var(--muted)' : t.correct ? 'var(--ok)' : 'var(--bad)'; return `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${col}"><title>${i === 0 ? 'Nivel inicial' : 'Pregunta ' + i + (t.expired ? ' (expirada)' : t.correct ? ' (correcta)' : ' (incorrecta)')}: ${v}</title></circle>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del nivel estimado a lo largo de ${n} preguntas">${grid}<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${pts.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>${dots}${xl}</svg>
  <div class="legend"><span><i style="background:var(--ok)"></i>Correcta</span><span><i style="background:var(--bad)"></i>Incorrecta o expirada</span><span>Eje vertical: nivel estimado (0 = A1, 6 = C2)</span></div>`;
}

function tick() {
  const ex = U.ex; if (ex.stage !== 'run') return clearInterval(ex.tm);
  const el = (Date.now() - ex.t0) / 1000, left = Math.max(0, ex.limit - el), bar = $('#tbar');
  if (bar) { bar.firstElementChild.style.width = (left / ex.limit * 100) + '%'; bar.classList.toggle('low', left / ex.limit < 0.2); $('#tsec').textContent = Math.ceil(left) + ' s'; }
  if (left <= 0) answer(null);
}
function answer(opt) {
  const ex = U.ex; clearInterval(ex.tm);
  const used = Math.min(ex.limit, (Date.now() - ex.t0) / 1000);
  applyAnswer(ex.E, ex.q, opt, used, ex.limit); nextStep();
}
function finishExam() {
  const ex = U.ex, sum = summarize(ex.E), a = ex.att;
  Object.assign(a, { status: 'finalizado', finishedAt: new Date().toISOString(), theta: sum.theta, level: sum.level, score: sum.score, bySkill: sum.bySkill, totalTime: sum.totalTime, trace: ex.E.trace });
  ex.cert = issueCert(S, a, S.cfg); ex.sum = sum; ex.stage = 'final'; commit();
}

function vVerificar() {
  const r = U.verRes;
  const samples = S.certs.filter((c, i, arr) => ['vigente', 'revocado', 'vencido'].every(() => true) && arr.findIndex(x => certState(x) === certState(c)) === i);
  let res = '';
  if (r) {
    if (!r.c) res = `<div class="notice bad"><b>Código no encontrado.</b> Verifica que esté escrito exactamente como aparece en el certificado.</div>`;
    else { const st = certState(r.c), a = byId(S.attempts, r.c.attemptId), p = candOf(a.candId);
      res = `<section class="panel"><div class="notice ${st === 'vigente' ? 'ok' : 'bad'}"><b>${st === 'vigente' ? 'Certificado válido y vigente' : st === 'revocado' ? 'Certificado revocado' : 'Certificado vencido'}</b></div>
        <dl class="dl"><dt>A nombre de</dt><dd><b>${esc(p?.name)}</b></dd><dt>Nivel MCER</dt><dd>${lvlTag(LEVELS.indexOf(a.level))} · puntaje ${a.score}/100</dd><dt>Número</dt><dd class="mono">${r.c.number}</dd><dt>Emitido</dt><dd>${fmtD(r.c.issuedAt)}</dd><dt>Vigente hasta</dt><dd>${fmtD(r.c.validUntil)}</dd>${st === 'revocado' ? `<dt>Revocado</dt><dd>${fmtD(r.c.revokedAt)}</dd>` : ''}</dl></section>`; }
  }
  return head('Verificar certificado', 'Consulta pública: ingresa el código de verificación impreso en el certificado.') +
    `<section class="panel" style="max-width:640px"><form data-form="verify" novalidate>${fld('Código de verificación', 'code', U.ver || S.certs[0]?.code || '', { req: 1, attrs: 'placeholder="VER-XXXX-XXXX" autocomplete="off" style="text-transform:uppercase"' })}<button class="btn btn-primary" type="submit">Verificar</button></form>
    <p class="muted" style="margin-top:14px">Códigos de ejemplo:</p><div class="chips">${samples.map(c => `<button class="chip" type="button" data-act="fillVer" data-code="${c.code}">${certState(c)[0].toUpperCase() + certState(c).slice(1)}</button>`).join('')}<button class="chip" type="button" data-act="fillVer" data-code="VER-0000-0000">No existe</button></div></section>${res}`;
}

function commit() { save(); render(); }
function renderHeader() {
  const a = S.auth, chip = $('#user-chip');

  if (a) chip.innerHTML = '<span class="av" aria-hidden="true">' + esc(initials(a.name)) + '</span><span><b>' + esc(a.name) + '</b><small>' + esc(a.role === 'org' ? orgName(a.orgId) : ROLE_LABEL[a.role] + (a.guest ? ' (con código)' : '')) + '</small></span>';

  else {
    const role = S.ui.role, nav = navOf(role);

    $('#main').innerHTML = U.pay ? vPago() : VIEWS[S.ui.view]();

  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) { /* tipos sin selección */ } } }
}
function guardExam() { if (examLocked()) { toast('Termina el examen en curso antes de salir.', 'warn'); return true; } return false; }

const A = {
  menu() { $('#side').classList.toggle('open'); render(); },

  async reset() { if (guardExam()) return; if (await confirmDlg({ title: 'Reiniciar datos de demo', msg: 'Se borrarán todos los cambios y se restaurarán los datos de ejemplo originales.', ok: 'Reiniciar', danger: true })) { try { localStorage.removeItem(KEY); } catch (e) { /* nada */ } S = seed(); U.pay = null; U.orgDetail = null; U.lotSel = null; U.f = {}; U.ex = { stage: 'entry' }; U.lastPurchase = null; commit(); toast('Datos de demo restaurados.'); } },
  nav(d) { if (guardExam()) return; U.pay = null; S.ui.view = d.view; U.orgDetail = null; U.lotSel = null; U.f = {}; U.ex = U.ex.stage === 'final' ? { stage: 'entry' } : U.ex.stage === 'instr' ? { stage: 'entry' } : U.ex; if (S.ui.view !== 'comprar') U.lastPurchase = null; $('#side').classList.remove('open'); commit(); $('#main').focus(); },

  orgOpen(d) { U.orgDetail = d.id; U.orgTab = 'datos'; U.f = {}; U.lotSel = null; render(); }, orgBack() { U.orgDetail = null; U.lotSel = null; U.f = {}; render(); },
  orgTab(d) { U.orgTab = d.tab; U.lotSel = null; U.f = {}; render(); },
  ctNew(d) { openContact(d.org); }, ctEdit(d) { openContact(d.org, d.id); },
  async ctDel(d) { if (await confirmDlg({ title: 'Eliminar contacto', msg: 'Esta acción no se puede deshacer.', ok: 'Eliminar', danger: true })) { S.contacts = S.contacts.filter(c => c.id !== d.id); commit(); toast('Contacto eliminado.'); } },
  batchNew() { openBatch(); }, lotOpen(d) { U.lotSel = d.id; U.f = {}; render(); }, lotBack() { U.lotSel = null; U.f = {}; render(); },

  licRevoke(d) { licAction('revoke', d.code); }, licRecover(d) { licAction('recover', d.code); }, licHist(d) { openHistory(d.code); }, bulkAssign(d) { openBulk(d.id); },
  qNew() { openQuestion(); }, qEdit(d) { openQuestion(d.id); }, qPrev(d) { openQPreview(byId(S.questions, d.id)); },
  qPrevForm(d, t) { const m = t.closest('.modal-bg'); const r = readQuestion($('form', m), {}); openQPreview(r.q); },
  async qStatus(d) { const q = byId(S.questions, d.id), nx = q.status === 'activa' ? 'retirada' : 'activa'; if (await confirmDlg({ title: nx === 'retirada' ? 'Retirar pregunta' : 'Activar pregunta', msg: `La pregunta ${q.id} pasará a estado «${nx}».`, ok: 'Confirmar' })) { q.status = nx; commit(); toast('Estado actualizado.'); } },
  async cfgReset() { if (await confirmDlg({ title: 'Restablecer configuración', msg: 'Se restauran los valores predeterminados del examen.', ok: 'Restablecer' })) { S.cfg = defaultCfg(); commit(); toast('Configuración restablecida.'); } },
  usrNew() { openUser(); }, usrEdit(d) { openUser(d.id); },
  async usrDel(d) { if (await confirmDlg({ title: 'Eliminar usuario', msg: 'Esta acción no se puede deshacer.', ok: 'Eliminar', danger: true })) { S.users = S.users.filter(u => u.id !== d.id); commit(); toast('Usuario eliminado.'); } },
  cdNew(d) { openCand(d.org || null); }, cdEdit(d) { openCand(d.org || null, d.id); }, cdImport(d) { openImport(d.org); },
  async cdDel(d) {
    if (S.licenses.some(l => l.candId === d.id && ['asignada', 'consumida'].includes(l.status))) { toast('Tiene licencias asignadas o consumidas: márcalo como inactivo en lugar de eliminarlo.', 'warn'); return; }
    if (await confirmDlg({ title: 'Eliminar candidato', msg: 'Esta acción no se puede deshacer.', ok: 'Eliminar', danger: true })) { S.candidates = S.candidates.filter(c => c.id !== d.id); commit(); toast('Candidato eliminado.'); }
  },
  xlsTemplate() { downloadTemplate(); },
  csvSample(d, t) { const ta = $('[name=csv]', t.closest('.modal-bg')); ta.value = 'tipo_doc,num_doc,codigo,nombres,correo,programa\nCC,1099000111,E2026001,Rafael Montoya Díaz,rafael.montoya@ejemplo.edu.co,Derecho\nCC,1099000112,E2026002,Elena Cortés Mora,elena.cortes@ejemplo.edu.co,Psicología\nXX,1,E0,Fila con tipo inválido,x@ejemplo.edu.co,N/A'; ta.focus(); },
  attOpen(d) { openAttempt(d.id); }, csv() { exportCSV(); }, print() { window.print(); },
  certView(d) { openCert(d.id); },
  certRevoke(d) { const c = byId(S.certs, d.id); openModal({ title: 'Revocar certificado ' + c.number, submit: 'Revocar', danger: true, body: `<p>Un certificado revocado deja de ser válido en el verificador público.</p>${fld('Motivo', 'reason', 'Suplantación de identidad detectada', { type: 'textarea', rows: 2, req: 1 })}`, onSubmit(v) { if (!v.reason.trim()) return { reason: 'Indica el motivo de la revocación.' }; c.status = 'revocado'; c.revokedAt = new Date().toISOString(); c.revokedReason = v.reason.trim(); save(); render(); closeTop(); closeTop(); openAttempt(d.att); toast('Certificado revocado.', 'warn'); return false; } }); },
  async certIssue(d) { const a = byId(S.attempts, d.att); if (await confirmDlg({ title: 'Emitir certificado', msg: 'Se emitirá un nuevo certificado con número y código propios.', ok: 'Emitir' })) { const n = issueCert(S, { ...a, finishedAt: new Date().toISOString() }, S.cfg); save(); render(); closeTop(); openAttempt(d.att); toast('Certificado ' + n.number + ' emitido.'); } },
  fill(d) { U.entry = { code: d.code, doc: d.doc }; render(); },

  buyAgain() { U.lastPurchase = null; render(); },

  guestVerify() { login({ role: 'pub', name: 'Visitante', guest: true }); },
  payMethod(d) { U.pay.method = d.m; render(); }, payFill(d) { U.pay.card.number = d.n; render(); },
  payRetry() { U.pay.stage = 'form'; U.pay.result = null; render(); }, payCancel() { U.pay = null; render(); },
  payDoneIndep() { U.pay = null; S.ui.view = 'comprar'; render(); },

};
// Un solo escuchador de clics para todas las acciones
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A') e.preventDefault();
  fn(t.dataset, t);
});
// Filtros y campos enlazados a U (data-bind="ruta.a.valor")
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  const path = t.dataset.bind.split('.'); let o = U; path.slice(0, -1).forEach(k => o = o[k]);
  o[path.at(-1)] = t.type === 'checkbox' ? t.checked : t.value; render();
});
// Formularios de página
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const kind = f.dataset.form;
  if (kind === 'cfg') saveCfg(f);
  else if (kind === 'entry') submitEntry(f);
  else if (kind === 'buy') submitBuy(f);
  else if (kind === 'lbuy') submitLote(f);
  else if (kind === 'pay') submitPay(f);
  else if (kind === 'login') submitLogin(f);
  else if (kind === 'reg') submitReg(f);
  else if (kind === 'start') { if (!f.ok.checked) { $('#e-ok').textContent = 'Debes confirmar para iniciar.'; f.ok.focus(); } else startExam(); }
  else if (kind === 'answer') { const r = f.querySelector('[name=ans]:checked'); if (!r) { toast('Selecciona una opción antes de responder.', 'warn'); return; } answer(+r.value); }
  else if (kind === 'verify') { const code = new FormData(f).get('code').trim().toUpperCase(); U.ver = code; if (!code) { $('#e-code').textContent = 'Ingresa el código.'; return; } U.verRes = { c: S.certs.find(c => c.code === code) }; render(); }
});
